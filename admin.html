<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CEMENTFIT | لوحة الإدارة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-color: #0d0f12;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.12);
            --accent-orange: #ff6b35;
            --text-main: #f3f4f6;
        }

        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; padding: 20px; }

        .container { max-width: 800px; margin: 40px auto; }
        
        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        h2 { margin-bottom: 20px; color: var(--accent-orange); }

        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 8px; font-weight: 600; }
        .input-group input, .input-group textarea {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: rgba(0,0,0,0.4);
            color: #fff;
            outline: none;
        }

        .btn {
            background: linear-gradient(135deg, var(--accent-orange), #e85d04);
            color: #fff;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            width: 100%;
            transition: all 0.3s ease;
        }

        .btn:active { transform: scale(0.98); }

        .product-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: rgba(0,0,0,0.3);
            border-radius: 14px;
            margin-bottom: 12px;
            border: 1px solid var(--glass-border);
        }

        .actions { display: flex; gap: 8px; }
        .btn-delete { background: #ef4444; color: white; border: none; padding: 8px 14px; border-radius: 8px; cursor: pointer; }
        .btn-edit { background: #3b82f6; color: white; border: none; padding: 8px 14px; border-radius: 8px; cursor: pointer; }
        .hidden { display: none !important; }

        /* Preview Image */
        #img-preview {
            max-width: 120px;
            max-height: 120px;
            margin-top: 10px;
            border-radius: 10px;
            display: none;
            border: 1px solid var(--glass-border);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Login Section -->
        <div id="login-section" class="card">
            <h2>تسجيل دخول لوحة الإدارة</h2>
            <div class="input-group">
                <label>البريد الإلكتروني</label>
                <input type="email" id="admin-email" placeholder="أدخل البريد الإلكتروني">
            </div>
            <div class="input-group">
                <label>كلمة السر</label>
                <input type="password" id="admin-pass" placeholder="أدخل كلمة السر">
            </div>
            <button class="btn" id="login-btn" onclick="checkLogin()">دخول</button>
        </div>

        <!-- Dashboard Section -->
        <div id="dashboard-section" class="hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h1>إدارة منتجات CEMENTFIT</h1>
                <button class="btn-delete" onclick="logout()">تسجيل خروج</button>
            </div>

            <!-- Form Add / Edit -->
            <div class="card">
                <h2 id="form-title">إضافة منتج جديد</h2>
                <input type="hidden" id="prod-id">
                <div class="input-group">
                    <label>اسم المنتج</label>
                    <input type="text" id="prod-name" placeholder="مثال: طارة خرسانية 10 كجم">
                </div>
                <div class="input-group">
                    <label>الوصف</label>
                    <textarea id="prod-desc" rows="3" placeholder="وصف المنتج..."></textarea>
                </div>
                <div class="input-group">
                    <label>السعر (بالجنيه)</label>
                    <input type="number" id="prod-price" placeholder="مثال: 350">
                </div>
                <div class="input-group">
                    <label>اختر صورة المنتج من جهازك</label>
                    <input type="file" id="prod-file" accept="image/*" onchange="previewImage(event)">
                    <img id="img-preview" alt="معاينة الصورة">
                </div>
                <button class="btn" id="save-btn" onclick="saveProduct()">حفظ المنتج</button>
            </div>

            <!-- Existing Products List -->
            <div class="card">
                <h2>المنتجات الحالية</h2>
                <div id="admin-products-list">جاري التحميل...</div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://mhdprpqckntptvgsmnlo.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_0qMAGKpfoQpHa5FoO-lNLg_5OIc2Kn_';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentBase64Image = '';

        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await _supabase.auth.getSession();
            if (session) showDashboard();
        });

        async function checkLogin() {
            const email = document.getElementById('admin-email').value.trim();
            const password = document.getElementById('admin-pass').value.trim();
            const btn = document.getElementById('login-btn');

            if (!email || !password) return alert('برجاء إدخال البيانات');

            btn.innerText = 'جاري التحقق...';

            const { error } = await _supabase.auth.signInWithPassword({ email, password });

            btn.innerText = 'دخول';

            if (error) {
                alert('البريد أو كلمة السر غير صحيحة');
            } else {
                showDashboard();
            }
        }

        function showDashboard() {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            loadAdminProducts();
        }

        async function logout() {
            await _supabase.auth.signOut();
            location.reload();
        }

        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentBase64Image = e.target.result;
                    const img = document.getElementById('img-preview');
                    img.src = currentBase64Image;
                    img.style.display = 'block';
                }
                reader.readAsDataURL(file);
            }
        }

        async function loadAdminProducts() {
            const list = document.getElementById('admin-products-list');
            list.innerHTML = 'جاري التحميل...';

            const { data: products, error } = await _supabase
                .from('products')
                .select('*')
                .order('id', { ascending: false });

            if (error) {
                list.innerHTML = 'حدث خطأ في تحميل البيانات.';
                return;
            }

            if (!products || products.length === 0) {
                list.innerHTML = 'لا توجد منتجات حالياً.';
                return;
            }

            list.innerHTML = '';
            products.forEach((prod) => {
                list.innerHTML += `
                    <div class="product-item">
                        <div>
                            <strong>${prod.name}</strong> - ${prod.price} ج.م
                        </div>
                        <div class="actions">
                            <button class="btn-edit" onclick="editProduct(${prod.id}, '${prod.name}', '${prod.desc || ''}', ${prod.price}, '${prod.image || ''}')">تعديل</button>
                            <button class="btn-delete" onclick="deleteProduct(${prod.id})">حذف</button>
                        </div>
                    </div>
                `;
            });
        }

        async function saveProduct() {
            const id = document.getElementById('prod-id').value;
            const name = document.getElementById('prod-name').value.trim();
            const desc = document.getElementById('prod-desc').value.trim();
            const price = Number(document.getElementById('prod-price').value);

            if(!name || !price) return alert('برجاء كتابة الاسم والسعر');

            let error;
            if(id) {
                const payload = { name, desc, price };
                if (currentBase64Image) payload.image = currentBase64Image;
                
                const res = await _supabase.from('products').update(payload).eq('id', id);
                error = res.error;
            } else {
                const res = await _supabase.from('products').insert([{ name, desc, price, image: currentBase64Image }]);
                error = res.error;
            }

            if (error) {
                alert('فشلت العملية: ' + error.message);
            } else {
                resetForm();
                loadAdminProducts();
            }
        }

        function editProduct(id, name, desc, price, image) {
            document.getElementById('prod-id').value = id;
            document.getElementById('prod-name').value = name;
            document.getElementById('prod-desc').value = desc;
            document.getElementById('prod-price').value = price;
            currentBase64Image = image;

            if(image) {
                const img = document.getElementById('img-preview');
                img.src = image;
                img.style.display = 'block';
            }

            document.getElementById('form-title').innerText = 'تعديل المنتج';
            document.getElementById('save-btn').innerText = 'تحديث البيانات';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function deleteProduct(id) {
            if(confirm('هل أنت متأكد من الحذف؟')) {
                const { error } = await _supabase.from('products').delete().eq('id', id);
                if (error) alert('فشل الحذف');
                else loadAdminProducts();
            }
        }

        function resetForm() {
            document.getElementById('prod-id').value = '';
            document.getElementById('prod-name').value = '';
            document.getElementById('prod-desc').value = '';
            document.getElementById('prod-price').value = '';
            document.getElementById('prod-file').value = '';
            document.getElementById('img-preview').style.display = 'none';
            currentBase64Image = '';
            document.getElementById('form-title').innerText = 'إضافة منتج جديد';
            document.getElementById('save-btn').innerText = 'حفظ المنتج';
        }
    </script>
</body>
</html>
