<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CEMENTFIT | جميع المنتجات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<link rel="icon" type="image/svg+xml" href="assets/logo-mark.svg">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body class="page-products">

<div class="toast-notification" id="toastNotification"><i class="fa-solid fa-circle-check" style="color:#25d366;font-size:1.1rem"></i><span id="toastText">تم إضافة المنتج للسلة بنجاح</span></div>

<header>
<a href="home.html" class="logo"><img src="assets/logo-mark.svg" class="logo-mark" alt=""><span><span class="logo-cement">CEMENT</span><span class="logo-fit">FIT</span></span></a>
<a href="home.html" class="nav-btn">الرئيسية</a>
</header>

<button class="floating-cart-btn" onclick="openCartModal()" aria-label="سلة المشتريات"><i class="fa-solid fa-cart-shopping"></i><span class="floating-cart-badge" id="cartCount">0</span></button>

<main class="container">
<div class="title-wrapper"><span class="eyebrow">CEMENTFIT QUALITY</span><h1 class="title">منتجات <span class="logo-cement">CEMENT</span><span class="logo-fit">FIT</span></h1><div class="title-line"></div></div>
<div class="controls-section">
<div class="search-box"><i class="fa-solid fa-magnifying-glass search-icon"></i><input type="text" id="searchInput" class="search-input" placeholder="ابحث عن منتج (مثل: دامبل، طارة...)" oninput="filterProducts()"></div>
<div class="filter-row">
<div class="filter-tags">
<button class="filter-btn active" onclick="setCategory('all',this)">الكل</button>
<button class="filter-btn" onclick="setCategory('دامبلز',this)">دامبلز</button>
<button class="filter-btn" onclick="setCategory('طارات',this)">طارات</button>
<button class="filter-btn" onclick="setCategory('كيتل بيل',this)">كيتل بيل</button>
</div>
<div class="sort-select-wrapper"><select id="sortSelect" class="sort-select" onchange="filterProducts()"><option value="default">الترتيب الافتراضي</option><option value="low-high">السعر: من الأقل للأعلى</option><option value="high-low">السعر: من الأعلى للأقل</option></select></div>
</div>
</div>
<div class="products-grid" id="products-container"><p style="grid-column:1/-1;text-align:center;color:var(--muted);padding:40px">جاري تحميل المنتجات...</p></div>
</main>

<div class="modal-overlay" id="cartModal" onclick="closeModal(event)">
<div class="modal-card">
<button class="modal-close" onclick="forceCloseModal('cartModal')" aria-label="إغلاق">&times;</button>
<div class="cart-modal-body">
<h2 style="font-size:1.35rem;font-weight:900;margin-bottom:15px"><i class="fa-solid fa-cart-shopping" style="color:var(--orange)"></i> سلة المشتريات</h2>
<div class="cart-items-list" id="cartItemsContainer"></div>
<div class="cart-summary">
<div class="cart-shipping-row"><span>تكلفة الشحن (<span id="cartShippingLoc" style="color:#fff">لا يوجد</span>):</span><span id="cartShippingPriceVal" style="color:var(--orange)">0 ج.م</span></div>
<div class="cart-total-row"><span>الإجمالي الكلي (شامل الشحن):</span><span id="cartTotalPrice" style="color:var(--orange)">0 ج.م</span></div>
<a href="#" id="whatsappCheckoutBtn" target="_blank" rel="noopener" class="btn-checkout-whatsapp">تأكيد الطلب عبر واتساب <i class="fa-brands fa-whatsapp"></i></a>
</div>
</div>
</div>
</div>

<script>
const SUPABASE_URL = 'https://mhdprpqckntptvgsmnlo.supabase.co';
const SUPABASE_KEY = 'sb_publishable_0qMAGKpfoQpHa5FoO-lNLg_5OIc2Kn_';

const DEFAULT_IMAGE = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='600'><rect width='600' height='600' fill='%23111216'/><polygon points='300,150 430,225 430,375 300,450 170,375 170,225' fill='none' stroke='%23ff5a00' stroke-width='10'/><text x='300' y='520' fill='%23999' font-family='Arial' font-size='34' text-anchor='middle'>CEMENTFIT</text></svg>";
let productsData = [];
let cart = [];
let currentCategory = 'all';
let toastTimeout = null;

try {
    const savedCart = JSON.parse(localStorage.getItem('cementfit_cart') || '[]');
    cart = Array.isArray(savedCart) ? savedCart : [];
} catch (error) {
    cart = [];
}

function escapeHTML(value) {
    return String(value ?? '').replace(/[&<>"']/g, ch => ({
        '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
    }[ch]));
}

function safeImageUrl(value) {
    if (!value) return DEFAULT_IMAGE;
    try {
        const url = new URL(value, window.location.href);
        return ['https:', 'http:'].includes(url.protocol) ? url.href : DEFAULT_IMAGE;
    } catch (error) {
        return DEFAULT_IMAGE;
    }
}

function showToast(message) {
    const toast = document.getElementById('toastNotification');
    document.getElementById('toastText').textContent = message;
    toast.classList.add('show');
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => toast.classList.remove('show'), 2500);
}

async function loadProducts() {
    const container = document.getElementById('products-container');
    container.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--muted);padding:40px">جاري تحميل المنتجات...</p>';

    try {
        // Use Supabase REST API directly; this does not depend on an external JS library/CDN.
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 15000);
        let response;
        try {
            response = await fetch(`${SUPABASE_URL}/rest/v1/products?select=*&order=id.desc`, {
                method: 'GET',
                headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': `Bearer ${SUPABASE_KEY}`,
                    'Accept': 'application/json'
                },
                signal: controller.signal
            });
        } finally {
            clearTimeout(timeoutId);
        }

        if (!response.ok) {
            const details = await response.text().catch(() => '');
            console.error('Supabase REST error:', response.status, details);
            container.innerHTML = `<div style="grid-column:1/-1;text-align:center;color:#ef4444;padding:40px;line-height:2">تعذّر تحميل المنتجات (HTTP ${response.status}).<br>تأكد من اتصال الإنترنت وصلاحيات قراءة جدول المنتجات في Supabase.</div>`;
            return;
        }

        const products = await response.json();
        if (!Array.isArray(products)) throw new Error('Unexpected products response');
        productsData = products;
        filterProducts();
        updateCartUI();
    } catch (error) {
        console.error('Failed to load products:', error);
        const message = error.name === 'AbortError'
            ? 'انتهت مهلة الاتصال بقاعدة البيانات.'
            : 'تعذّر الاتصال بقاعدة البيانات. تأكد من الإنترنت ثم حدّث الصفحة.';
        container.innerHTML = `<div style="grid-column:1/-1;text-align:center;color:#ef4444;padding:40px;line-height:2">${message}<br>لو استمرت المشكلة، ابعتلي صورة الرسالة.</div>`;
    }
}

function goToProduct(id) {
    window.location.href = `product.html?id=${encodeURIComponent(String(id))}`;
}

function renderProducts(list) {
    const container = document.getElementById('products-container');
    container.innerHTML = '';

    if (!list.length) {
        container.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--muted);padding:45px 10px">لا توجد منتجات مطابقة لعملية البحث أو الفلترة.</p>';
        return;
    }

    list.forEach((prod, index) => {
        const oldPrice = Number(prod.old_price);
        const price = Number(prod.price) || 0;
        const hasDiscount = oldPrice > price;
        const discount = hasDiscount ? Math.round(((oldPrice - price) / oldPrice) * 100) : 0;
        const card = document.createElement('article');
        card.className = 'product-card';
        card.style.animationDelay = `${index * 0.04}s`;
        card.tabIndex = 0;
        card.setAttribute('role', 'link');
        card.setAttribute('aria-label', `تفاصيل ${prod.name || 'المنتج'}`);
        card.addEventListener('click', () => goToProduct(prod.id));
        card.addEventListener('keydown', event => {
            if (event.key === 'Enter' || event.key === ' ') {
                event.preventDefault();
                goToProduct(prod.id);
            }
        });

        const badge = hasDiscount ? `<div class="discount-badge">خصم ${discount}%</div>` : '';
        const oldPriceHTML = hasDiscount ? `<span class="old-price">${oldPrice.toLocaleString('en-US')} ج.م</span>` : '';
        card.innerHTML = `
            ${badge}
            <img src="${escapeHTML(prod.image || DEFAULT_IMAGE)}" alt="${escapeHTML(prod.name || 'المنتج')}" class="product-img" loading="lazy">
            <div class="product-info">
                <h3 class="product-name">${escapeHTML(prod.name || 'منتج CEMENTFIT')}</h3>
                <p class="product-desc">${escapeHTML(prod.desc || 'منتج عالي الجودة من CEMENTFIT.')}</p>
                <div class="product-footer">
                    <div class="price-container"><span class="price">${price.toLocaleString('en-US')} ج.م</span>${oldPriceHTML}</div>
                    <button type="button" class="btn-add-cart"><i class="fa-solid fa-cart-plus"></i> أضف للسلة</button>
                </div>
            </div>`;

        const img = card.querySelector('.product-img');
        img.addEventListener('error', () => { img.src = DEFAULT_IMAGE; }, { once: true });
        card.querySelector('.btn-add-cart').addEventListener('click', event => {
            event.stopPropagation();
            addToCart(prod.id);
        });
        container.appendChild(card);
    });
}

function filterProducts() {
    const query = document.getElementById('searchInput').value.toLowerCase().trim();
    const sortVal = document.getElementById('sortSelect').value;

    let filtered = productsData.filter(product => {
        const name = String(product.name || '').toLowerCase();
        const desc = String(product.desc || '').toLowerCase();
        const matchesSearch = name.includes(query) || desc.includes(query);
        const category = currentCategory.toLowerCase();
        const matchesCategory = category === 'all' || name.includes(category) || desc.includes(category);
        return matchesSearch && matchesCategory;
    });

    if (sortVal === 'low-high') filtered.sort((a,b) => Number(a.price) - Number(b.price));
    if (sortVal === 'high-low') filtered.sort((a,b) => Number(b.price) - Number(a.price));
    renderProducts(filtered);
}

function setCategory(category, button) {
    currentCategory = category;
    document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
    button.classList.add('active');
    filterProducts();
}

function saveCart() {
    localStorage.setItem('cementfit_cart', JSON.stringify(cart));
}

function addToCart(id) {
    const product = productsData.find(item => String(item.id) === String(id));
    if (!product) return;

    const existing = cart.find(item => String(item.id) === String(id));
    if (existing) existing.qty = (Number(existing.qty) || 0) + 1;
    else cart.push({ ...product, qty: 1 });

    saveCart();
    updateCartUI();
    showToast(`تم إضافة "${product.name}" للسلة بنجاح`);
}

function changeQty(id, delta) {
    const item = cart.find(product => String(product.id) === String(id));
    if (!item) return;

    item.qty = (Number(item.qty) || 0) + delta;
    if (item.qty <= 0) cart = cart.filter(product => String(product.id) !== String(id));

    saveCart();
    updateCartUI();
}

function updateCartUI() {
    saveCart();
    document.getElementById('cartCount').textContent = cart.reduce((sum, item) => sum + (Number(item.qty) || 0), 0);

    const itemsContainer = document.getElementById('cartItemsContainer');
    itemsContainer.innerHTML = '';

    if (!cart.length) {
        itemsContainer.innerHTML = '<p style="text-align:center;color:var(--muted);margin:30px 0">السلة فارغة حالياً</p>';
        document.getElementById('cartShippingPriceVal').textContent = '0 ج.م';
        document.getElementById('cartShippingLoc').textContent = 'لا يوجد';
        document.getElementById('cartTotalPrice').textContent = '0 ج.م';
        document.getElementById('whatsappCheckoutBtn').href = '#';
        return;
    }

    let productsTotal = 0;
    let maxShipping = 0;
    let shippingLocation = 'حسب المتفق عليه';
    let orderText = 'السلام عليكم،\nممكن اطلب:\n';

    cart.forEach(item => {
        const qty = Number(item.qty) || 1;
        const price = Number(item.price) || 0;
        productsTotal += price * qty;
        orderText += `${item.name} - الكمية: ${qty} - السعر: ${price} ج.م\n`;

        const shipping = Number(item.shipping_price) || 0;
        if (shipping > maxShipping) {
            maxShipping = shipping;
            shippingLocation = item.shipping_locations || 'جميع المحافظات';
        }

        const row = document.createElement('div');
        row.className = 'cart-item';
        const details = document.createElement('div');
        details.className = 'cart-item-details';
        const name = document.createElement('h4');
        name.textContent = item.name;
        const line = document.createElement('p');
        line.textContent = `${price.toLocaleString('en-US')} ج.م × ${qty}`;
        details.append(name, line);

        const controls = document.createElement('div');
        controls.className = 'cart-item-controls';
        const minus = document.createElement('button');
        minus.className = 'qty-btn';
        minus.textContent = '−';
        minus.setAttribute('aria-label', 'تقليل الكمية');
        minus.addEventListener('click', () => changeQty(item.id, -1));
        const count = document.createElement('span');
        count.style.fontWeight = '800';
        count.textContent = qty;
        const plus = document.createElement('button');
        plus.className = 'qty-btn';
        plus.textContent = '+';
        plus.setAttribute('aria-label', 'زيادة الكمية');
        plus.addEventListener('click', () => changeQty(item.id, 1));
        controls.append(minus, count, plus);
        row.append(details, controls);
        itemsContainer.appendChild(row);
    });

    document.getElementById('cartShippingPriceVal').textContent = `${maxShipping.toLocaleString('en-US')} ج.م`;
    document.getElementById('cartShippingLoc').textContent = shippingLocation;
    document.getElementById('cartTotalPrice').textContent = `${(productsTotal + maxShipping).toLocaleString('en-US')} ج.م`;
    document.getElementById('whatsappCheckoutBtn').href =
        `https://wa.me/201212338084?text=${encodeURIComponent(orderText + `الشحن: ${maxShipping} ج.م\nالإجمالي: ${productsTotal + maxShipping} ج.م`)}`;
}

function openCartModal() {
    updateCartUI();
    document.getElementById('cartModal').classList.add('active');
}

function closeModal(event) {
    if (event.target.classList.contains('modal-overlay')) event.target.classList.remove('active');
}

function forceCloseModal(id) {
    document.getElementById(id).classList.remove('active');
}

document.addEventListener('keydown', event => {
    if (event.key === 'Escape') document.querySelectorAll('.modal-overlay.active').forEach(modal => modal.classList.remove('active'));
});

loadProducts();

</script>
</body>
</html>
