<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CEMENTFIT | جميع المنتجات</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        :root {
            --bg-color: #0d0f12;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-hover: rgba(255, 255, 255, 0.1);
            --accent-orange: #ff6b35;
            --accent-glow: rgba(255, 107, 53, 0.25);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 50px;
            overflow-x: hidden;
            position: relative;
        }

        .glow-blob-1 {
            position: fixed;
            top: -100px;
            right: -100px;
            width: 350px;
            height: 350px;
            background: var(--accent-orange);
            filter: blur(140px);
            opacity: 0.25;
            border-radius: 50%;
            z-index: -1;
            pointer-events: none;
        }

        .glow-blob-2 {
            position: fixed;
            bottom: -50px;
            left: -100px;
            width: 400px;
            height: 400px;
            background: #e85d04;
            filter: blur(160px);
            opacity: 0.18;
            border-radius: 50%;
            z-index: -1;
            pointer-events: none;
        }

        header {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 1100px;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 900;
            color: #fff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            direction: ltr;
        }
        .logo-cement { color: #ffffff; }
        .logo-fit { color: var(--accent-orange); }

        .nav-btn {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 700;
            padding: 8px 18px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--glass-border);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-btn:active, .nav-btn:hover {
            background: rgba(255, 255, 255, 0.18);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .container { max-width: 1100px; margin: 120px auto 0; padding: 0 20px; }
        .title { text-align: center; margin-bottom: 40px; font-size: 2.2rem; font-weight: 900; animation: fadeIn 0.8s ease; }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .product-card {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 22px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            position: relative;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            animation: fadeInUp 0.6s ease forwards;
        }

        .product-card:hover {
            transform: translateY(-7px) scale(1.02);
            background: var(--glass-hover);
            border-color: rgba(255, 255, 255, 0.25);
            box-shadow: 0 15px 35px rgba(0,0,0,0.4), 0 0 20px var(--accent-glow);
        }

        .discount-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: linear-gradient(135deg, #ff6b35, #e85d04);
            color: #fff;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 800;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 5;
        }

        .product-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background: rgba(0,0,0,0.4);
            border-bottom: 1px solid var(--glass-border);
        }

        .product-info { padding: 20px; display: flex; flex-direction: column; flex-grow: 1; }
        .product-name { font-size: 1.3rem; font-weight: 800; margin-bottom: 8px; color: #fff; }
        .product-desc { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 15px; flex-grow: 1; line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        
        .price-container { display: flex; align-items: baseline; gap: 8px; }
        .price { font-size: 1.3rem; font-weight: 900; color: var(--accent-orange); }
        .old-price { font-size: 0.95rem; color: var(--text-muted); text-decoration: line-through; }

        .product-footer { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }

        .btn-order {
            background: linear-gradient(135deg, var(--accent-orange), #e85d04);
            color: #fff;
            padding: 9px 18px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .btn-order:hover { transform: scale(1.05); }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex; justify-content: center; align-items: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 20px;
        }

        .modal-overlay.active { opacity: 1; visibility: visible; }

        .modal-card {
            background: rgba(25, 28, 35, 0.9);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            max-width: 520px;
            width: 100%;
            overflow: hidden;
            position: relative;
            transform: scale(0.8) translateY(30px);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }

        .modal-overlay.active .modal-card { transform: scale(1) translateY(0); }

        .modal-close {
            position: absolute;
            top: 15px; left: 15px;
            width: 36px; height: 36px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid var(--glass-border);
            border-radius: 50%;
            color: #fff;
            font-size: 1.2rem;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            z-index: 10;
            transition: all 0.3s ease;
        }

        .modal-close:hover { background: rgba(239, 68, 68, 0.8); transform: rotate(90deg); }

        .modal-img { width: 100%; max-height: 280px; object-fit: cover; border-bottom: 1px solid var(--glass-border); }
        .modal-body { padding: 25px; }
        .modal-title { font-size: 1.6rem; font-weight: 900; margin-bottom: 10px; color: #fff; }
        .modal-desc { color: var(--text-muted); line-height: 1.7; margin-bottom: 20px; font-size: 0.95rem; }

        .shipping-info-box {
            background: rgba(255, 255, 255, 0.04);
            border: 1px dashed var(--glass-border);
            border-radius: 12px;
            padding: 12px 15px;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }
        .shipping-info-box div { margin-bottom: 5px; display: flex; align-items: center; gap: 8px; }
        .shipping-info-box div:last-child { margin-bottom: 0; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="glow-blob-1"></div>
    <div class="glow-blob-2"></div>

    <header>
        <a href="index.html" class="logo">
            <i class="fa-solid fa-dumbbell" style="color: var(--accent-orange);"></i>
            <span><span class="logo-cement">CEMENT</span><span class="logo-fit">FIT</span></span>
        </a>
        <a href="index.html" class="nav-btn">الرئيسية</a>
    </header>

    <div class="container">
        <h1 class="title">منتجات <span style="color: var(--accent-orange);">CEMENTFIT</span></h1>
        
        <div class="products-grid" id="products-container">
            <p style="grid-column: 1/-1; text-align: center; color: var(--text-muted);">جاري تحميل المنتجات...</p>
        </div>
    </div>

    <!-- Glassy Modal -->
    <div class="modal-overlay" id="productModal" onclick="closeModal(event)">
        <div class="modal-card">
            <button class="modal-close" onclick="forceCloseModal()">&times;</button>
            <img src="" id="modalImg" class="modal-img" alt="المنتج">
            <div class="modal-body">
                <h2 class="modal-title" id="modalTitle"></h2>
                <p class="modal-desc" id="modalDesc"></p>

                <div class="shipping-info-box">
                    <div><i class="fa-solid fa-truck" style="color: var(--accent-orange);"></i> <span>مصاريف الشحن: <strong id="modalShippingPrice" style="color:#fff;"></strong></span></div>
                    <div><i class="fa-solid fa-location-dot" style="color: var(--accent-orange);"></i> <span>الأماكن المتاحة للشحن: <strong id="modalShippingLocs" style="color:#fff;"></strong></span></div>
                </div>

                <div class="product-footer">
                    <div class="price-container">
                        <span class="price" id="modalPrice"></span>
                        <span class="old-price" id="modalOldPrice"></span>
                    </div>
                    <a href="" id="modalOrderBtn" target="_blank" class="btn-order">
                        اطلب الآن <i class="fa-brands fa-whatsapp"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://mhdprpqckntptvgsmnlo.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_0qMAGKpfoQpHa5FoO-lNLg_5OIc2Kn_';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let productsData = [];

        async function loadProducts() {
            const container = document.getElementById('products-container');
            container.innerHTML = '';
            
            const { data: products, error } = await _supabase
                .from('products')
                .select('*')
                .order('id', { ascending: false });

            if (error || !products) {
                container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #ef4444;">حدث خطأ أثناء تحميل المنتجات.</p>';
                return;
            }

            if (products.length === 0) {
                container.innerHTML = '<p style="grid-column: 1/-1; text-align: center;">لا توجد منتجات حالياً.</p>';
                return;
            }

            productsData = products;

            products.forEach((prod, index) => {
                const defaultImg = 'https://via.placeholder.com/300x200?text=CementFit';
                
                let discountBadgeHtml = '';
                let oldPriceHtml = '';
                
                if (prod.old_price && prod.old_price > prod.price) {
                    const discountPercent = Math.round(((prod.old_price - prod.price) / prod.old_price) * 100);
                    discountBadgeHtml = `<div class="discount-badge">خصم ${discountPercent}%</div>`;
                    oldPriceHtml = `<span class="old-price">${prod.old_price} ج.م</span>`;
                }

                const shippingTxt = prod.shipping_price ? ` (الشحن: ${prod.shipping_price} ج.م)` : '';
                const whatsappMsg = encodeURIComponent(`السلام عليكم، أريد طلب منتج: ${prod.name} بسعر ${prod.price} ج.م${shippingTxt}`);

                container.innerHTML += `
                    <div class="product-card" style="animation-delay: ${index * 0.08}s;" onclick="openModal(${prod.id})">
                        ${discountBadgeHtml}
                        <img src="${prod.image || defaultImg}" alt="${prod.name}" class="product-img">
                        <div class="product-info">
                            <h3 class="product-name">${prod.name}</h3>
                            <p class="product-desc">${prod.desc || 'منتج عالي الجودة من CEMENTFIT.'}</p>
                            <div class="product-footer">
                                <div class="price-container">
                                    <span class="price">${prod.price} ج.م</span>
                                    ${oldPriceHtml}
                                </div>
                                <a href="https://wa.me/201212338084?text=${whatsappMsg}" onclick="event.stopPropagation()" target="_blank" class="btn-order">
                                    اطلب الآن <i class="fa-brands fa-whatsapp"></i>
                                </a>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function openModal(id) {
            const prod = productsData.find(p => p.id === id);
            if(!prod) return;

            document.getElementById('modalImg').src = prod.image || 'https://via.placeholder.com/300x200?text=CementFit';
            document.getElementById('modalTitle').innerText = prod.name;
            document.getElementById('modalDesc').innerText = prod.desc || 'لا يوجد وصف إضافي.';
            document.getElementById('modalPrice').innerText = prod.price + ' ج.م';
            
            const oldPriceEl = document.getElementById('modalOldPrice');
            if (prod.old_price && prod.old_price > prod.price) {
                oldPriceEl.innerText = prod.old_price + ' ج.م';
                oldPriceEl.style.display = 'inline';
            } else {
                oldPriceEl.style.display = 'none';
            }

            document.getElementById('modalShippingPrice').innerText = prod.shipping_price ? `${prod.shipping_price} ج.م` : 'مجاناً أو يحدد مع الطلب';
            document.getElementById('modalShippingLocs').innerText = prod.shipping_locations || 'جميع المحافظات';

            const shippingTxt = prod.shipping_price ? ` (الشحن: ${prod.shipping_price} ج.م)` : '';
            const whatsappMsg = encodeURIComponent(`السلام عليكم، أريد طلب منتج: ${prod.name} بسعر ${prod.price} ج.م${shippingTxt}`);
            document.getElementById('modalOrderBtn').href = `https://wa.me/201212338084?text=${whatsappMsg}`;

            document.getElementById('productModal').classList.add('active');
        }

        function closeModal(e) {
            if(e.target.classList.contains('modal-overlay')) {
                document.getElementById('productModal').classList.remove('active');
            }
        }

        function forceCloseModal() {
            document.getElementById('productModal').classList.remove('active');
        }

        loadProducts();
    </script>
</body>
</html>
