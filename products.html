<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>CEMENTFIT | جميع المنتجات</title>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        /* =========================================================
           RESET
        ========================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
            scroll-behavior: smooth;
            outline: none;
        }

        :root {
            --bg: #050607;
            --bg-soft: #0b0c0e;

            --orange: #ff5a00;
            --orange-light: #ff7518;
            --orange-dark: #d94700;

            --orange-glow:
                rgba(255, 90, 0, 0.35);

            --white: #f5f5f5;
            --muted: #9a9a9a;

            --glass:
                rgba(255,255,255,0.045);

            --glass-strong:
                rgba(20,20,20,0.82);

            --border:
                rgba(255,255,255,0.10);
        }


        /* =========================================================
           BODY
        ========================================================= */

        html,
        body {
            width: 100%;
            min-height: 100%;
            overflow-x: hidden;
        }

        body {
            background:
                radial-gradient(
                    circle at 75% 5%,
                    rgba(255, 80, 0, 0.10),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 15% 70%,
                    rgba(255, 70, 0, 0.06),
                    transparent 30%
                ),
                #050607;

            color: var(--white);
            padding-bottom: 100px;
            position: relative;
        }


        /* =========================================================
           INDUSTRIAL BACKGROUND
        ========================================================= */

        body::before {
            content: "";
            position: fixed;
            inset: 0;

            background:
                linear-gradient(
                    115deg,
                    transparent 0%,
                    transparent 48%,
                    rgba(255,90,0,0.045) 49%,
                    transparent 50%
                );

            background-size: 360px 360px;

            pointer-events: none;
            z-index: -10;
        }


        /* =========================================================
           ORANGE GLOW
        ========================================================= */

        .glow-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(130px);
            pointer-events: none;
            z-index: -5;
        }

        .orb-1 {
            width: 330px;
            height: 330px;
            background: var(--orange);
            top: -180px;
            right: -100px;
            opacity: 0.18;
        }

        .orb-2 {
            width: 420px;
            height: 420px;
            background: #ff3d00;
            bottom: -230px;
            left: -150px;
            opacity: 0.10;
        }


        /* =========================================================
           HEXAGON DECORATIONS
        ========================================================= */

        .hex {
            position: fixed;
            width: 100px;
            height: 86px;

            border: 1px solid rgba(255,90,0,0.25);

            clip-path: polygon(
                25% 0%,
                75% 0%,
                100% 50%,
                75% 100%,
                25% 100%,
                0% 50%
            );

            pointer-events: none;
            z-index: -3;
        }

        .hex::before {
            content: "";
            position: absolute;
            inset: 7px;

            border: 1px solid rgba(255,90,0,0.08);

            clip-path: inherit;
        }

        .hex-1 {
            top: 190px;
            left: -45px;
            transform: rotate(12deg);
        }

        .hex-2 {
            top: 330px;
            right: -55px;
            width: 125px;
            height: 108px;
            opacity: .6;
        }

        .hex-3 {
            top: 750px;
            left: -30px;
            width: 70px;
            height: 61px;
            opacity: .55;
        }

        .hex-4 {
            top: 1050px;
            right: -25px;
            width: 85px;
            height: 74px;
            opacity: .45;
        }


        /* =========================================================
           DIAGONAL ORANGE LINES
        ========================================================= */

        .design-line {
            position: fixed;
            width: 300px;
            height: 1px;
            background: linear-gradient(
                90deg,
                transparent,
                var(--orange),
                transparent
            );

            box-shadow: 0 0 12px rgba(255,90,0,.5);

            opacity: .35;
            pointer-events: none;
            z-index: -2;
        }

        .line-1 {
            top: 285px;
            left: -80px;
            transform: rotate(-28deg);
        }

        .line-2 {
            top: 620px;
            right: -100px;
            transform: rotate(28deg);
        }

        .line-3 {
            top: 1100px;
            left: -100px;
            transform: rotate(25deg);
        }


        /* =========================================================
           HEADER
        ========================================================= */

        header {
            position: fixed;

            top: 14px;
            left: 50%;
            transform: translateX(-50%);

            width: calc(100% - 28px);
            max-width: 1150px;

            min-height: 60px;

            background:
                linear-gradient(
                    135deg,
                    rgba(35,35,35,.82),
                    rgba(10,10,10,.78)
                );

            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);

            border: 1px solid rgba(255,255,255,.12);

            border-radius: 17px;

            padding: 9px 14px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            z-index: 1000;

            box-shadow:
                0 15px 40px rgba(0,0,0,.55),
                inset 0 1px rgba(255,255,255,.04);
        }

        header::after {
            content: "";

            position: absolute;

            bottom: -1px;
            left: 8%;
            right: 8%;

            height: 1px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    var(--orange),
                    transparent
                );

            opacity: .8;
        }


        /* =========================================================
           LOGO
        ========================================================= */

        .logo {
            text-decoration: none;

            display: flex;
            align-items: center;

            gap: 7px;

            direction: ltr;

            font-size: 1.12rem;
            font-weight: 900;

            color: white;
        }

        .logo i {
            color: var(--orange);

            filter:
                drop-shadow(
                    0 0 7px rgba(255,90,0,.6)
                );
        }

        .logo-cement {
            color: #f5f5f5;
        }

        .logo-fit {
            color: var(--orange);
        }


        /* =========================================================
           HOME BUTTON
        ========================================================= */

        .nav-btn {
            color: #fff;

            text-decoration: none;

            font-size: .78rem;
            font-weight: 800;

            padding: 8px 15px;

            border-radius: 10px;

            background:
                rgba(255,255,255,.055);

            border:
                1px solid rgba(255,255,255,.12);

            transition:
                transform .2s ease,
                box-shadow .2s ease,
                background .2s ease;
        }

        .nav-btn:hover {
            background:
                rgba(255,90,0,.15);

            border-color:
                rgba(255,90,0,.45);

            box-shadow:
                0 0 18px rgba(255,90,0,.25);
        }

        .nav-btn:active {
            transform: scale(.92);

            background:
                var(--orange);

            box-shadow:
                0 0 15px var(--orange),
                0 0 35px rgba(255,90,0,.6);
        }


        /* =========================================================
           MAIN CONTAINER
        ========================================================= */

        .container {
            width: 100%;
            max-width: 1150px;

            margin: 0 auto;

            padding:
                120px 22px 40px;
        }


        /* =========================================================
           PAGE TITLE
        ========================================================= */

        .title-wrapper {
            text-align: center;

            margin-bottom: 32px;

            position: relative;
        }

        .eyebrow {
            display: block;

            color: var(--orange);

            font-size: .62rem;
            font-weight: 800;

            letter-spacing: 4px;

            margin-bottom: 9px;

            text-transform: uppercase;
        }

        .title {
            font-size: clamp(
                1.8rem,
                5vw,
                2.8rem
            );

            font-weight: 900;

            line-height: 1.2;

            color: #fff;

            text-shadow:
                0 3px 20px rgba(0,0,0,.8);
        }

        .title-line {
            width: 130px;
            height: 2px;

            margin: 13px auto 0;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    var(--orange),
                    transparent
                );

            box-shadow:
                0 0 10px var(--orange);
        }


        /* =========================================================
           SEARCH
        ========================================================= */

        .controls-section {
            width: 100%;

            display: flex;
            flex-direction: column;

            gap: 15px;

            margin-bottom: 35px;
        }

        .search-box {
            position: relative;

            width: 100%;
        }

        .search-input {
            width: 100%;

            min-height: 54px;

            padding:
                12px 48px 12px 18px;

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,.055),
                    rgba(255,255,255,.025)
                );

            border:
                1px solid rgba(255,255,255,.11);

            border-radius: 14px;

            color: #fff;

            font-size: .92rem;

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            transition:
                .25s ease;
        }

        .search-input::placeholder {
            color: #777;
        }

        .search-input:focus {
            border-color:
                rgba(255,90,0,.7);

            box-shadow:
                0 0 0 1px rgba(255,90,0,.15),
                0 0 22px rgba(255,90,0,.18);
        }

        .search-icon {
            position: absolute;

            right: 17px;
            top: 50%;

            transform: translateY(-50%);

            color: var(--orange);

            font-size: .95rem;
        }


        /* =========================================================
           FILTERS
        ========================================================= */

        .filter-row {
            display: flex;

            align-items: center;

            gap: 12px;

            width: 100%;
        }

        .filter-tags {
            display: flex;

            gap: 8px;

            overflow-x: auto;

            flex: 1;

            scrollbar-width: none;

            padding:
                2px 2px 7px;
        }

        .filter-tags::-webkit-scrollbar {
            display: none;
        }

        .filter-btn {
            background:
                rgba(255,255,255,.045);

            border:
                1px solid rgba(255,255,255,.10);

            color:
                #a7a7a7;

            padding:
                8px 15px;

            border-radius: 10px;

            font-size: .78rem;
            font-weight: 800;

            white-space: nowrap;

            cursor: pointer;

            transition:
                all .22s ease;
        }

        .filter-btn:hover {
            color: white;

            border-color:
                rgba(255,90,0,.45);
        }

        .filter-btn.active {
            color: white;

            background:
                linear-gradient(
                    135deg,
                    var(--orange),
                    var(--orange-dark)
                );

            border-color:
                transparent;

            box-shadow:
                0 0 15px rgba(255,90,0,.3);
        }

        .filter-btn:active {
            transform: scale(.92);

            box-shadow:
                0 0 25px var(--orange),
                0 0 50px rgba(255,90,0,.5);
        }


        /* =========================================================
           SORT
        ========================================================= */

        .sort-select-wrapper {
            min-width: 185px;
            position: relative;
        }

        .sort-select {
            width: 100%;

            min-height: 40px;

            background:
                rgba(255,255,255,.045);

            border:
                1px solid rgba(255,255,255,.11);

            color: #ddd;

            padding:
                8px 13px;

            border-radius: 10px;

            font-size: .76rem;
            font-weight: 700;

            appearance: none;

            cursor: pointer;
        }

        .sort-select:focus {
            border-color:
                var(--orange);

            box-shadow:
                0 0 15px rgba(255,90,0,.2);
        }

        .sort-select option {
            background: #111;
            color: #fff;
        }


        /* =========================================================
           PRODUCTS GRID
        ========================================================= */

        .products-grid {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(275px, 1fr)
                );

            gap: 22px;

            width: 100%;
        }


        /* =========================================================
           PRODUCT CARD
        ========================================================= */

        .product-card {
            position: relative;

            overflow: hidden;

            display: flex;
            flex-direction: column;

            min-width: 0;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.065),
                    rgba(255,255,255,.025)
                );

            border:
                1px solid rgba(255,255,255,.10);

            border-radius: 18px;

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            box-shadow:
                0 15px 35px rgba(0,0,0,.35);

            cursor: pointer;

            animation:
                cardIn .55s ease forwards;

            opacity: 0;

            transition:
                transform .35s ease,
                border-color .35s ease,
                box-shadow .35s ease,
                background .35s ease;
        }

        .product-card::before {
            content: "";

            position: absolute;

            top: 0;
            left: 0;
            right: 0;

            height: 2px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    var(--orange),
                    transparent
                );

            opacity: .65;

            z-index: 5;
        }

        .product-card::after {
            content: "";

            position: absolute;

            width: 120px;
            height: 120px;

            right: -60px;
            bottom: -60px;

            border:
                1px solid rgba(255,90,0,.15);

            transform: rotate(30deg);

            pointer-events: none;
        }

        .product-card:hover {
            transform:
                translateY(-7px);

            border-color:
                rgba(255,90,0,.42);

            background:
                linear-gradient(
                    145deg,
                    rgba(255,90,0,.075),
                    rgba(255,255,255,.035)
                );

            box-shadow:
                0 25px 50px rgba(0,0,0,.55),
                0 0 28px rgba(255,90,0,.16);
        }


        /* =========================================================
           DISCOUNT
        ========================================================= */

        .discount-badge {
            position: absolute;

            top: 12px;
            right: 12px;

            background:
                linear-gradient(
                    135deg,
                    var(--orange),
                    var(--orange-dark)
                );

            color: #fff;

            padding:
                5px 10px;

            border-radius: 8px;

            font-size: .72rem;
            font-weight: 900;

            box-shadow:
                0 4px 15px rgba(0,0,0,.45),
                0 0 12px rgba(255,90,0,.25);

            z-index: 10;
        }


        /* =========================================================
           PRODUCT IMAGE
        ========================================================= */

        .product-img {
            width: 100%;

            height: 220px;

            object-fit: cover;

            display: block;

            background:
                radial-gradient(
                    circle,
                    #202020,
                    #090909
                );

            border-bottom:
                1px solid rgba(255,255,255,.08);

            transition:
                transform .45s ease,
                filter .45s ease;
        }

        .product-card:hover .product-img {
            transform: scale(1.035);

            filter:
                brightness(1.08);
        }


        /* =========================================================
           PRODUCT INFO
        ========================================================= */

        .product-info {
            padding: 18px;

            display: flex;
            flex-direction: column;

            flex-grow: 1;
        }

        .product-name {
            color: #fff;

            font-size: 1.18rem;

            font-weight: 900;

            margin-bottom: 7px;
        }

        .product-desc {
            color: #929292;

            font-size: .84rem;

            line-height: 1.7;

            margin-bottom: 17px;

            flex-grow: 1;

            display: -webkit-box;

            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;

            overflow: hidden;
        }


        /* =========================================================
           PRICE
        ========================================================= */

        .price-container {
            display: flex;

            align-items: center;

            gap: 8px;

            white-space: nowrap;
        }

        .price {
            color:
                var(--orange);

            font-size:
                1.18rem;

            font-weight:
                900;

            text-shadow:
                0 0 12px rgba(255,90,0,.2);
        }

        .old-price {
            color:
                #777;

            font-size:
                .78rem;

            text-decoration:
                line-through;
        }

        .product-footer {
            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 10px;
        }


        /* =========================================================
           ADD CART BUTTON
        ========================================================= */

        .btn-add-cart {
            border: none;

            color: #fff;

            background:
                linear-gradient(
                    135deg,
                    var(--orange),
                    var(--orange-dark)
                );

            padding:
                9px 13px;

            border-radius: 10px;

            font-size: .78rem;
            font-weight: 900;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 6px;

            cursor: pointer;

            white-space: nowrap;

            box-shadow:
                0 5px 15px rgba(255,90,0,.20);

            transition:
                all .2s ease;
        }

        .btn-add-cart:hover {
            transform:
                translateY(-2px);

            box-shadow:
                0 0 20px rgba(255,90,0,.55);
        }

        .btn-add-cart:active {
            transform:
                scale(.90);

            background:
                #ff6a00;

            box-shadow:
                0 0 15px #ff5a00,
                0 0 35px rgba(255,90,0,.7),
                0 0 65px rgba(255,90,0,.35);
        }


        /* =========================================================
           FLOATING CART
        ========================================================= */

        .floating-cart-btn {
            position: fixed;

            bottom:
                max(22px, env(safe-area-inset-bottom));

            right: 20px;

            width: 58px;
            height: 58px;

            border-radius: 50%;

            border:
                1px solid rgba(255,255,255,.12);

            background:
                linear-gradient(
                    135deg,
                    var(--orange),
                    var(--orange-dark)
                );

            color: #fff;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 1.2rem;

            cursor: pointer;

            z-index: 1500;

            box-shadow:
                0 7px 25px rgba(0,0,0,.5),
                0 0 22px rgba(255,90,0,.35);

            transition:
                .2s ease;
        }

        .floating-cart-btn:hover {
            transform:
                scale(1.08);

            box-shadow:
                0 0 25px var(--orange),
                0 0 50px rgba(255,90,0,.45);
        }

        .floating-cart-btn:active {
            transform:
                scale(.87);

            box-shadow:
                0 0 18px var(--orange),
                0 0 50px rgba(255,90,0,.8);
        }

        .floating-cart-badge {
            position: absolute;

            top: -3px;
            right: -3px;

            width: 21px;
            height: 21px;

            border-radius: 50%;

            background: #fff;

            color: var(--orange);

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: .68rem;
            font-weight: 900;

            box-shadow:
                0 3px 10px rgba(0,0,0,.4);
        }


        /* =========================================================
           TOAST
        ========================================================= */

        .toast-notification {
            position: fixed;

            bottom: 92px;

            left: 50%;

            transform:
                translateX(-50%)
                translateY(100px);

            width:
                max-content;

            max-width:
                calc(100% - 30px);

            background:
                rgba(18,18,18,.90);

            backdrop-filter:
                blur(22px);

            -webkit-backdrop-filter:
                blur(22px);

            border:
                1px solid rgba(255,255,255,.12);

            color: white;

            padding:
                11px 18px;

            border-radius: 13px;

            font-size: .8rem;
            font-weight: 800;

            display: flex;

            align-items: center;

            gap: 8px;

            z-index: 3000;

            opacity: 0;

            transition:
                .35s ease;

            box-shadow:
                0 15px 35px rgba(0,0,0,.6),
                0 0 20px rgba(255,90,0,.15);

            pointer-events: none;
        }

        .toast-notification.show {
            transform:
                translateX(-50%)
                translateY(0);

            opacity: 1;
        }


        /* =========================================================
           MODALS
        ========================================================= */

        .modal-overlay {
            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            background:
                rgba(0,0,0,.82);

            backdrop-filter:
                blur(15px);

            -webkit-backdrop-filter:
                blur(15px);

            display:
                flex;

            justify-content:
                center;

            align-items:
                center;

            padding: 16px;

            z-index: 2000;

            opacity: 0;
            visibility: hidden;

            transition:
                .35s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-card {
            width: 100%;

            max-width: 520px;

            max-height:
                calc(100dvh - 30px);

            overflow:
                hidden;

            position: relative;

            background:
                linear-gradient(
                    145deg,
                    rgba(28,28,28,.97),
                    rgba(8,8,8,.98)
                );

            border:
                1px solid rgba(255,255,255,.12);

            border-radius: 20px;

            box-shadow:
                0 30px 80px rgba(0,0,0,.8),
                0 0 35px rgba(255,90,0,.08);

            transform:
                scale(.85)
                translateY(25px);

            transition:
                .4s cubic-bezier(.16,1,.3,1);

            overflow-y: auto;
        }

        .modal-overlay.active .modal-card {
            transform:
                scale(1)
                translateY(0);
        }

        .modal-card::before {
            content: "";

            position: absolute;

            top: 0;
            left: 0;
            right: 0;

            height: 2px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    var(--orange),
                    transparent
                );

            z-index: 5;
        }

        .modal-close {
            position: absolute;

            top: 12px;
            left: 12px;

            width: 36px;
            height: 36px;

            border-radius: 50%;

            border:
                1px solid rgba(255,255,255,.12);

            background:
                rgba(0,0,0,.55);

            color: #fff;

            font-size: 1.25rem;

            display: flex;

            align-items: center;
            justify-content: center;

            cursor: pointer;

            z-index: 20;

            transition:
                .2s ease;
        }

        .modal-close:hover {
            background:
                var(--orange);

            box-shadow:
                0 0 20px rgba(255,90,0,.5);

            transform:
                rotate(90deg);
        }

        .modal-close:active {
            transform:
                scale(.85)
                rotate(90deg);

            box-shadow:
                0 0 30px var(--orange);
        }

        .modal-img {
            width: 100%;

            max-height: 280px;

            object-fit: cover;

            display: block;

            border-bottom:
                1px solid rgba(255,255,255,.08);
        }

        .modal-body {
            padding: 20px;
        }

        .modal-title {
            font-size: 1.4rem;

            font-weight: 900;

            color: white;

            margin-bottom: 7px;
        }

        .modal-desc {
            color: #999;

        }

        .shipping-info-box {

            border:

            padding: 12px 14px;

        .shipping-info-box div {

            align-items: center;

            gap: 8px;

            margin-bottom: 5px;
        }

        .shipping-info-box div:last-child {
            margin-bottom: 0;
        }


        /* =========================================================
           CART
        ========================================================= */

        .cart-modal-body {
            padding: 22px;

            max-height:
                calc(100dvh - 60px);

            display:
                flex;

            flex-direction:
                column;
        }

        .cart-items-list {

            max-height: 290px;

            margin-bottom: 15px;

        }

        .cart-item {
            display: flex;

            align-items: center;

            justify-content: space-between;

        }

        .cart-item-details p {

            font-size: .75rem;

        .qty-btn {

        .qty-btn:hover {

        }

        .qty-btn:active {

            box-shadow:
                0 0 15px var(--orange);
        }

        .cart-summary {
            border-top:
                1px solid rgba(255,255,255,.10);

            padding-top: 15px;

            display:
                flex;

            flex-direction:
                column;

            gap: 9px;
        }

        .cart-shipping-row,
        .cart-total-row {
            display:
                flex;

            justify-content:
                space-between;

            gap: 10px;

            font-size: .8rem;

            color: #999;
        }

        .cart-total-row {
            font-size: .95rem;

            font-weight: 900;

            color: white;

            border-top:
                1px dashed rgba(255,255,255,.10);

            padding-top: 10px;
        }

        .btn-checkout-whatsapp {
            background:
                #25d366;

            color: white;

            text-align: center;

            padding: 12px;

            border-radius: 12px;

            text-decoration: none;

            font-weight: 900;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 9px;

            font-size: .88rem;

            margin-top: 5px;

            box-shadow:
                0 5px 18px rgba(37,211,102,.18);

            transition: .2s ease;
        }

        .btn-checkout-whatsapp:hover {
            box-shadow:
                0 0 20px #25d366;
        }

        .btn-checkout-whatsapp:active {
            transform: scale(.94);

            box-shadow:
                0 0 25px #25d366,
                0 0 55px rgba(37,211,102,.45);
        }


        /* =========================================================
           ANIMATIONS
        ========================================================= */

        @keyframes cardIn {

            from {
                opacity: 0;
                transform:
                    translateY(25px)
                    scale(.97);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0)
                    scale(1);
            }

        }


        /* =========================================================
           TABLET
        ========================================================= */

        @media (max-width: 700px) {

            .container {
                padding:
                    105px 14px 35px;
            }

            .filter-row {
                flex-direction: column;

                align-items: stretch;
            }

            .filter-tags {
                width: 100%;
            }

            .sort-select-wrapper {
                width: 100%;
                min-width: 0;
            }

            .products-grid {
                grid-template-columns:
                    repeat(
                        2,
                        minmax(0,1fr)
                    );

                gap: 12px;
            }

            .product-img {
                height: 175px;
            }

            .product-info {
                padding: 13px;
            }

            .product-name {
                font-size: .98rem;
            }

            .product-desc {
                font-size: .73rem;
                line-height: 1.6;
            }

            .price {
                font-size: .95rem;
            }

            .old-price {
                font-size: .67rem;
            }

            .btn-add-cart {
                padding:
                    8px 9px;

                font-size:
                    .67rem;
            }

            .floating-cart-btn {

            }

            .hex-2,
            .hex-4 {
                right: -70px;

        /* =========================================================
           SMALL PHONES

        @media (max-width: 390px) {

            header {
                width:
                    calc(100% - 18px);

                    7px 11px;
            }

            }

            .product-footer {

            }

            }

            .old-price {

            }

            }

        /* =========================================================

            .products-grid {
                grid-template-columns:
                    1fr;
            }

            }

        }

    </style>
</head>

    <!-- =========================================================

        <!-- =====================================================

        <div

    <!-- =========================================================
         PRODUCT MODAL

    <div

    <!-- =========================================================
         CART MODAL

    <div
        class="modal-overlay"
        id="cartModal"
        onclick="closeModal(event)">

        <div class="modal-card">

            <button
                class="modal-close"
                onclick="forceCloseModal('cartModal')">

                &times;

            </button>


            <div class="cart-modal-body">


                <h2
                    style="
                        font-size:1.35rem;
                        font-weight:900;
                        margin-bottom:15px;
                        color:#fff;
                    ">

                    <i
                        class="fa-solid fa-cart-shopping"
                        style="color:var(--orange);">
                    </i>

                    سلة المشتريات

                </h2>


                <div
                    class="cart-items-list"
                    id="cartItemsContainer">

                </div>


                <div class="cart-summary">


                    <div class="cart-shipping-row">

                        <span>

                            تكلفة الشحن
                            (
                            <span
                                id="cartShippingLoc"
                                style="color:#fff;">
                                لا يوجد
                            </span>
                            ):

                        </span>

                        <span

                            style="color:var(--orange);">

                            0 ج.م

                        </span>

                    </div>


                    <div class="cart-total-row">

                        <span>
                            الإجمالي الكلي (شامل الشحن):
                        </span>

                        <span
                            id="cartTotalPrice"
                            style="color:var(--orange);">

                            0 ج.م

                        </span>

                    </div>


                    <a
                        href="#"
                        id="whatsappCheckoutBtn"
                        target="_blank"
                        class="btn-checkout-whatsapp">

                        تأكيد الطلب عبر واتساب

                        <i class="fa-brands fa-whatsapp"></i>

                    </a>

                </div>

            </div>

        </div>

    </div>


    <!-- =========================================================
         JAVASCRIPT
         SUPABASE + CART
    ========================================================= -->

    <script>

        /* =====================================================
           SUPABASE
        ===================================================== */

        const SUPABASE_URL =
            'https://mhdprpqckntptvgsmnlo.supabase.co';

        const SUPABASE_KEY =
            'sb_publishable_0qMAGKpfoQpHa5FoO-lNLg_5OIc2Kn_';

        const _supabase =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        /* =====================================================
           VARIABLES
        ===================================================== */

        let productsData = [];

        let cart = [];

        let currentCategory = 'all';

        let toastTimeout = null;


        /* =====================================================
           TOAST
        ===================================================== */

        function showToast(message) {

            const toast =
                document.getElementById(
                    'toastNotification'
                );

            document.getElementById(
                'toastText'
            ).innerText = message;

            toast.classList.add('show');

            if (toastTimeout) {
                clearTimeout(toastTimeout);
            }

            toastTimeout =
                setTimeout(() => {

                    toast.classList.remove('show');

                }, 2500);

        }


        /* =====================================================
           LOAD PRODUCTS FROM SUPABASE
        ===================================================== */

        async function loadProducts() {

            const container =
                document.getElementById(
                    'products-container'
                );

            container.innerHTML = `

                <p
                    style="
                        grid-column:1/-1;
                        text-align:center;
                        color:var(--muted);
                        padding:40px;
                    ">

                    جاري تحميل المنتجات...

                </p>

            `;


            const {
                data: products,
                error
            } = await _supabase

                .from('products')

                .select('*')

                .order(
                    'id',
                    {
                        ascending: false
                    }
                );


            if (error || !products) {

                container.innerHTML = `

                    <p
                        style="
                            grid-column:1/-1;
                            text-align:center;
                            color:#ef4444;
                            padding:40px;
                        ">

                        حدث خطأ أثناء تحميل المنتجات.

                    </p>

                `;

                return;
            }


            productsData = products;

            filterProducts();

        }


        /* =====================================================
           RENDER PRODUCTS
        ===================================================== */

        function renderProducts(list) {

            const container =
                document.getElementById(
                    'products-container'
                );

            container.innerHTML = '';


            if (list.length === 0) {

                container.innerHTML = `

                    <p
                        style="
                            grid-column:1/-1;
                            text-align:center;
                            color:var(--muted);
                            padding:45px 10px;
                        ">

                        لا توجد منتجات مطابقة
                        لعملية البحث أو الفلترة.

                    </p>

                `;

                return;
            }


            list.forEach((prod, index) => {

                const defaultImg =
                    'https://via.placeholder.com/300x200?text=CementFit';


                let discountBadgeHtml = '';

                let oldPriceHtml = '';


                if (
                    prod.old_price &&
                    prod.old_price > prod.price
                ) {

                    const discountPercent =
                        Math.round(
                            (
                                (prod.old_price - prod.price)
                                /
                                prod.old_price
                            ) * 100
                        );


                    discountBadgeHtml = `

                        <div class="discount-badge">

                            خصم ${discountPercent}%

                        </div>

                    `;


                    oldPriceHtml = `

                        <span class="old-price">

                            ${prod.old_price} ج.م

                        </span>

                    `;

                }


                container.innerHTML += `

                    <div
                        class="product-card"
                        style="
                            animation-delay:
                            ${index * 0.06}s;
                        "
                        onclick="openModal(${prod.id})">


                        ${discountBadgeHtml}


                        <img
                            src="${prod.image || defaultImg}"
                            alt="${prod.name}"
                            class="product-img">


                        <div class="product-info">


                            <h3 class="product-name">

                                ${prod.name}

                            </h3>


                            <p class="product-desc">

                                ${
                                    prod.desc ||
                                    'منتج عالي الجودة من CEMENTFIT.'
                                }

                            </p>


                            <div class="product-footer">


                                <div class="price-container">

                                    <span class="price">

                                        ${prod.price} ج.م

                                    </span>

                                    ${oldPriceHtml}

                                </div>


                                <button
                                    class="btn-add-cart"
                                    onclick="
                                        event.stopPropagation();
                                        addToCart(${prod.id});
                                    ">

                                    أضف للسلة

                                    <i
                                        class="fa-solid fa-cart-plus">
                                    </i>

                                </button>


                            </div>


                        </div>

                    </div>

                `;

            });

        }


        /* =====================================================
           FILTER PRODUCTS
        ===================================================== */

        function filterProducts() {

            const query =
                document
                    .getElementById('searchInput')
                    .value
                    .toLowerCase()
                    .trim();


            const sortVal =
                document
                    .getElementById('sortSelect')
                    .value;


            let filtered =
                productsData.filter(p => {


                    const matchesName =
                        p.name
                            ?
                            p.name
                                .toLowerCase()
                                .includes(query)
                            :
                            false;


                    const matchesDesc =
                        p.desc
                            ?
                            p.desc
                                .toLowerCase()
                                .includes(query)
                            :
                            false;


                    const matchesSearch =
                        matchesName ||
                        matchesDesc;


                    let matchesCat = true;


                    if (
                        currentCategory !== 'all'
                    ) {

                        const normalizeText =
                            (txt) =>

                                txt
                                    ?
                                    txt
                                        .toLowerCase()
                                        .replace(
                                            /ة/g,
                                            'ه'
                                        )
                                        .replace(
                                            /(ات|ين|ان|s)$/,
                                            ''
                                        )
                                    :
                                    '';


                        const cleanCat =
                            normalizeText(
                                currentCategory
                            );


                        const productName =
                            normalizeText(
                                p.name
                            );


                        const productDesc =
                            normalizeText(
                                p.desc
                            );


                        matchesCat =
                            productName.includes(
                                cleanCat
                            )
                            ||
                            productDesc.includes(
                                cleanCat
                            );

                    }


                    return (
                        matchesSearch &&
                        matchesCat
                    );

                });


            if (sortVal === 'low-high') {

                filtered.sort(
                    (a, b) =>
                        parseFloat(a.price)
                        -
                        parseFloat(b.price)
                );

            }

            else if (
                sortVal === 'high-low'
            ) {

                filtered.sort(
                    (a, b) =>
                        parseFloat(b.price)
                        -
                        parseFloat(a.price)
                );

            }


            renderProducts(filtered);

        }


        /* =====================================================
           CATEGORY
        ===================================================== */

        function setCategory(cat, btn) {

            currentCategory = cat;


            document
                .querySelectorAll('.filter-btn')
                .forEach(b =>
                    b.classList.remove('active')
                );


            btn.classList.add('active');


            filterProducts();

        }


        /* =====================================================
           ADD TO CART
        ===================================================== */

        function addToCart(id) {

            const prod =
                productsData.find(
                    p => p.id === id
                );


            if (!prod) return;


            const existing =
                cart.find(
                    item => item.id === id
                );


            if (existing) {

                existing.qty += 1;

            }

            else {

                cart.push({
                    ...prod,
                    qty: 1
                });

            }


            updateCartUI();


            showToast(
                `تم إضافة "${prod.name}" للسلة بنجاح`
            );

        }


        /* =====================================================
           CHANGE QUANTITY
        ===================================================== */

        function changeQty(id, delta) {

            const item =
                cart.find(
                    i => i.id === id
                );


            if (!item) return;


            item.qty += delta;


            if (item.qty <= 0) {

                cart =
                    cart.filter(
                        i => i.id !== id
                    );

            }


            updateCartUI();

        }


        /* =====================================================
           UPDATE CART UI
        ===================================================== */

        function updateCartUI() {

            const totalItems =
                cart.reduce(
                    (sum, item) =>
                        sum + item.qty,
                    0
                );


            document.getElementById(
                'cartCount'
            ).innerText =
                totalItems;


            const itemsContainer =
                document.getElementById(
                    'cartItemsContainer'
                );


            itemsContainer.innerHTML = '';


            if (cart.length === 0) {

                itemsContainer.innerHTML = `

                    <p
                        style="
                            text-align:center;
                            color:var(--muted);
                            margin:30px 0;
                        ">

                        السلة فارغة حالياً

                    </p>

                `;


                document.getElementById(
                    'cartShippingPriceVal'
                ).innerText =
                    '0 ج.م';


                document.getElementById(
                    'cartShippingLoc'
                ).innerText =
                    'لا يوجد';


                document.getElementById(
                    'cartTotalPrice'
                ).innerText =
                    '0 ج.م';


                document.getElementById(
                    'whatsappCheckoutBtn'
                ).href =
                    '#';


                return;

            }


            let productsTotalPrice = 0;

            let maxShippingPrice = 0;

            let maxShippingLocation =
                "حسب المتفق عليه";


            let orderSummaryText =
                "السلام عليكم،\nممكن اطلب:\n";


            cart.forEach(item => {


                const itemTotal =
                    item.price *
                    item.qty;


                productsTotalPrice +=
                    itemTotal;


                orderSummaryText +=
                    `${item.name} (${item.qty})\n`;


                const itemShipping =
                    parseFloat(
                        item.shipping_price
                    ) || 0;


                if (
                    itemShipping >
                    maxShippingPrice
                ) {

                    maxShippingPrice =
                        itemShipping;

                    maxShippingLocation =
                        item.shipping_locations
                        ||
                        "جميع المحافظات";

                }


                itemsContainer.innerHTML += `

                    <div class="cart-item">


                        <div class="cart-item-details">

                            <h4>
                                ${item.name}
                            </h4>

                            <p>
                                ${item.price} ج.م
                                &times;
                                ${item.qty}
                            </p>

                        </div>


                        <div class="cart-item-controls">


                            <button
                                class="qty-btn"
                                onclick="
                                    changeQty(
                                        ${item.id},
                                        -1
                                    )
                                ">

                                -

                            </button>


                            <span
                                style="
                                    font-weight:800;
                                    color:#fff;
                                ">

                                ${item.qty}

                            </span>


                            <button
                                class="qty-btn"
                                onclick="
                                    changeQty(
                                        ${item.id},
                                        1
                                    )
                                ">

                                +

                            </button>


                        </div>


                    </div>

                `;

            });


            const finalTotalPrice =
                productsTotalPrice +
                maxShippingPrice;


            document.getElementById(
                'cartShippingPriceVal'
            ).innerText =
                `${maxShippingPrice} ج.م`;


            document.getElementById(
                'cartShippingLoc'
            ).innerText =
                maxShippingLocation;


            document.getElementById(
                'cartTotalPrice'
            ).innerText =
                `${finalTotalPrice} ج.م`;


            const encodedMsg =
                encodeURIComponent(
                    orderSummaryText.trim()
                );


            document.getElementById(
                'whatsappCheckoutBtn'
            ).href =
                `https://wa.me/201212338084?text=${encodedMsg}`;

        }


        /* =====================================================
           OPEN CART
        ===================================================== */

        function openCartModal() {

            updateCartUI();

            document
                .getElementById('cartModal')
                .classList.add('active');

        }


        /* =====================================================
           OPEN PRODUCT MODAL
        ===================================================== */

        function openModal(id) {

            const prod =
                productsData.find(
                    p => p.id === id
                );


            if (!prod) return;


            document.getElementById(
                'modalImg'
            ).src =
                prod.image
                ||
                'https://via.placeholder.com/300x200?text=CementFit';


            document.getElementById(
                'modalTitle'
            ).innerText =
                prod.name;


            document.getElementById(
                'modalDesc'
            ).innerText =
                prod.desc
                ||
                'لا يوجد وصف إضافي.';


            document.getElementById(
                'modalPrice'
            ).innerText =
                prod.price +
                ' ج.م';


            const oldPriceEl =
                document.getElementById(
                    'modalOldPrice'
                );


            if (
                prod.old_price &&
                prod.old_price >
                prod.price
            ) {

                oldPriceEl.innerText =
                    prod.old_price +
                    ' ج.م';

                oldPriceEl.style.display =
                    'inline';

            }

            else {

                oldPriceEl.style.display =
                    'none';

            }


            document.getElementById(
                'modalShippingPrice'
            ).innerText =

                prod.shipping_price
                ?
                `${prod.shipping_price} ج.م`
                :
                'مجاناً أو يحدد مع الطلب';


            document.getElementById(
                'modalShippingLocs'
            ).innerText =

                prod.shipping_locations
                ||
                'جميع المحافظات';


            const addBtn =
                document.getElementById(
                    'modalAddToCartBtn'
                );


            addBtn.onclick =
                function() {

                    addToCart(prod.id);

                    forceCloseModal(
                        'productModal'
                    );

                };


            document
                .getElementById('productModal')
                .classList.add('active');

        }


        /* =====================================================
           CLOSE MODAL
        ===================================================== */

        function closeModal(e) {

            if (
                e.target.classList
                    .contains('modal-overlay')
            ) {

                e.target
                    .classList
                    .remove('active');

            }

        }


        function forceCloseModal(modalId) {

            document
                .getElementById(modalId)
                .classList
                .remove('active');

        }


        /* =====================================================
           ESCAPE KEY
        ===================================================== */

        document.addEventListener(
            'keydown',
            function(e) {

                if (e.key === 'Escape') {

                    document
                        .querySelectorAll(
                            '.modal-overlay.active'
                        )
                        .forEach(modal => {

                            modal.classList.remove(
                                'active'
                            );

                        });

                }

            }
        );


        /* =====================================================
           START
        ===================================================== */

        loadProducts();

    </script>

</body>
</html>
