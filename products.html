<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CEMENTFIT | المنتجات</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        :root {
            --black: #080808;
            --black-2: #101010;
            --dark: #151515;

            --orange: #ff6b00;
            --orange-light: #ff8a24;

            --white: #fff;
            --gray: #a3a3a3;

            --border: rgba(255,107,0,.18);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: "Cairo", sans-serif;

            background:
                radial-gradient(
                    circle at 85% 0%,
                    rgba(255,107,0,.09),
                    transparent 27%
                ),
                radial-gradient(
                    circle at 10% 55%,
                    rgba(255,107,0,.05),
                    transparent 30%
                ),
                #080808;

            color: #fff;

            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: "";

            position: fixed;
            inset: 0;

            pointer-events: none;

            opacity: .04;

            background-image:
                linear-gradient(
                    rgba(255,255,255,.5) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,.5) 1px,
                    transparent 1px
                );

            background-size: 45px 45px;

            z-index: -2;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        button,
        input,
        select {
            font-family: inherit;
        }

        button {
            cursor: pointer;
        }

        /* =========================
           HEADER
        ========================== */

        header {
            position: fixed;

            top: 0;
            right: 0;
            left: 0;

            height: 74px;

            z-index: 1000;

            background: rgba(8,8,8,.9);

            border-bottom:
                1px solid rgba(255,107,0,.13);

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
        }

        .nav {
            width: min(1180px, 94%);
            height: 100%;
            margin: auto;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;

            gap: 9px;

            font-size: 24px;
            font-weight: 900;

            white-space: nowrap;
        }

        .logo-mark {
            width: 33px;
            height: 33px;

            border: 2px solid var(--orange);

            display: grid;
            place-items: center;

            transform: rotate(30deg);

            box-shadow:
                0 0 20px rgba(255,107,0,.18);
        }

        .logo-mark span {
            transform: rotate(-30deg);

            color: var(--orange);

            font-weight: 900;
        }

        .logo-c {
            color: white;
        }

        .logo-fit {
            color: var(--orange);
        }

        .nav-links {
            display: flex;
            align-items: center;

            gap: 30px;
        }

        .nav-links a {
            color: #bcbcbc;

            font-size: 14px;
            font-weight: 700;

            position: relative;

            transition: .2s;
        }

        .nav-links a::after {
            content: "";

            position: absolute;

            right: 0;
            bottom: -8px;

            width: 0;
            height: 2px;

            background: var(--orange);

            box-shadow:
                0 0 10px var(--orange);

            transition: .25s;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: #fff;
        }

        .nav-links a:hover::after,
        .nav-links a.active::after {
            width: 100%;
        }

        .nav-button {
            background: var(--orange);

            padding: 9px 17px;

            border-radius: 6px;

            font-size: 13px;
            font-weight: 800;

            transition: .2s;
        }

        .nav-button:hover {
            background: var(--orange-light);

            box-shadow:
                0 0 25px rgba(255,107,0,.3);
        }

        .menu-btn {
            display: none;

            border: 0;
            background: transparent;

            color: #fff;

            font-size: 24px;
        }

        /* =========================
           PAGE
        ========================== */

        .page {
            width: min(1200px, 94%);
            margin: auto;

            padding-top: 115px;
            padding-bottom: 70px;
        }

        .page-header {
            text-align: center;
            margin-bottom: 38px;
        }

        .page-header small {
            color: var(--orange);

            font-size: 12px;
            font-weight: 900;

            letter-spacing: 1px;
        }

        .page-header h1 {
            font-size: clamp(35px, 5vw, 58px);

            line-height: 1.1;

            font-weight: 900;

            margin-top: 8px;
        }

        .page-header p {
            color: #8e8e8e;

            max-width: 600px;

            margin:
                13px
                auto
                0;

            line-height: 1.9;

            font-size: 14px;
        }

        /* =========================
           FILTERS
        ========================== */

        .controls {
            display: grid;

            grid-template-columns:
                1fr
                auto;

            gap: 12px;

            margin-bottom: 16px;
        }

        .search-box {
            position: relative;
        }

        .search-box i {
            position: absolute;

            right: 16px;
            top: 50%;

            transform: translateY(-50%);

            color: var(--orange);

            pointer-events: none;
        }

        .search-box input {
            width: 100%;

            height: 48px;

            padding:
                0 47px
                0 15px;

            color: #fff;

            background: rgba(255,255,255,.035);

            border:
                1px solid rgba(255,255,255,.1);

            border-radius: 7px;

            outline: none;

            font-size: 13px;

            transition: .2s;
        }

        .search-box input:focus {
            border-color: rgba(255,107,0,.5);

            box-shadow:
                0 0 20px rgba(255,107,0,.08);
        }

        .sort-select {
            min-width: 210px;

            height: 48px;

            padding: 0 14px;

            color: #ddd;

            background: #121212;

            border:
                1px solid rgba(255,255,255,.1);

            border-radius: 7px;

            outline: none;

            font-size: 13px;
        }

        .categories {
            display: flex;

            gap: 8px;

            flex-wrap: wrap;

            margin-bottom: 30px;
        }

        .category-btn {
            border:
                1px solid rgba(255,255,255,.1);

            background: rgba(255,255,255,.025);

            color: #aaa;

            border-radius: 6px;

            padding:
                9px 17px;

            font-size: 13px;
            font-weight: 700;

            transition: .2s;
        }

        .category-btn:hover,
        .category-btn.active {
            background: var(--orange);

            color: #fff;

            border-color: var(--orange);

            box-shadow:
                0 0 22px rgba(255,107,0,.22);
        }

        .category-btn:active {
            transform: scale(.95);
            box-shadow:
                0 0 30px rgba(255,107,0,.5);
        }

        /* =========================
           PRODUCTS
        ========================== */

        .products-grid {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 17px;
        }

        .product-card {
            position: relative;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.055),
                    rgba(255,255,255,.015)
                );

            border:
                1px solid rgba(255,255,255,.08);

            border-radius: 9px;

            overflow: hidden;

            transition:
                transform .25s,
                border-color .25s,
                box-shadow .25s;
        }

        .product-card:hover {
            transform: translateY(-5px);

            border-color:
                rgba(255,107,0,.35);

            box-shadow:
                0 20px 45px rgba(0,0,0,.4);
        }

        .product-image {
            height: 225px;

            position: relative;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at center,
                    rgba(255,107,0,.07),
                    transparent 55%
                ),
                #101010;

            overflow: hidden;
        }

        .product-image::before {
            content: "";

            position: absolute;

            width: 190px;
            height: 215px;

            border:
                1px solid rgba(255,107,0,.09);

            clip-path: polygon(
                25% 3%,
                75% 3%,
                100% 50%,
                75% 97%,
                25% 97%,
                0 50%
            );

            transform: rotate(15deg);
        }

        .product-image img {
            position: relative;

            width: 100%;
            height: 100%;

            object-fit: contain;

            z-index: 2;

            transition: .3s;
        }

        .product-card:hover .product-image img {
            transform: scale(1.04);
        }

        .image-fallback {
            position: relative;
            z-index: 3;

            color: rgba(255,107,0,.55);

            font-size: 55px;
        }

        .product-info {
            padding: 18px;
        }

        .product-category {
            display: inline-block;

            color: var(--orange);

            font-size: 10px;
            font-weight: 800;

            padding: 4px 8px;

            border:
                1px solid rgba(255,107,0,.2);

            background:
                rgba(255,107,0,.06);

            border-radius: 4px;

            margin-bottom: 10px;
        }

        .product-name {
            font-size: 17px;
            font-weight: 800;

            margin-bottom: 8px;
        }

        .product-description {
            color: #858585;

            font-size: 12px;

            line-height: 1.8;

            min-height: 43px;

            margin-bottom: 15px;
        }

        .product-bottom {
            display: flex;

            align-items: center;
            justify-content: space-between;

            gap: 10px;
        }

        .price {
            color: #fff;

            font-size: 20px;

            font-weight: 900;
        }

        .price span {
            color: var(--orange);

            font-size: 11px;

            margin-right: 3px;
        }

        .order-btn {
            border: 0;

            background: var(--orange);

            color: #fff;

            min-height: 42px;

            padding:
                0 14px;

            border-radius: 6px;

            font-size: 12px;

            font-weight: 800;

            display: inline-flex;

            align-items: center;
            justify-content: center;

            gap: 7px;

            transition: .18s;
        }

        .order-btn:hover {
            background: var(--orange-light);

            box-shadow:
                0 0 25px rgba(255,107,0,.35);
        }

        .order-btn:active {
            transform: scale(.94);

            box-shadow:
                0 0 12px rgba(255,107,0,.75),
                0 0 35px rgba(255,107,0,.4);
        }

        .empty {
            grid-column: 1 / -1;

            text-align: center;

            padding: 70px 20px;

            color: #777;
        }

        .empty i {
            color: var(--orange);

            font-size: 45px;

            margin-bottom: 15px;
        }

        .loading {
            grid-column: 1 / -1;

            text-align: center;

            padding: 70px 20px;

            color: #999;
        }

        .loading i {
            color: var(--orange);

            font-size: 30px;

            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* =========================
           MODALS
        ========================== */

        .modal {
            position: fixed;

            inset: 0;

            background:
                rgba(0,0,0,.78);

            backdrop-filter: blur(7px);

            z-index: 3000;

            display: none;

            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .modal.show {
            display: flex;
        }

        .modal-box {
            width: min(650px, 100%);

            max-height: 90vh;

            overflow-y: auto;

            background:
                linear-gradient(
                    145deg,
                    #191919,
                    #0c0c0c
                );

            border:
                1px solid rgba(255,107,0,.22);

            border-radius: 10px;

            box-shadow:
                0 30px 100px rgba(0,0,0,.7);

            position: relative;
        }

        .modal-header {
            display: flex;

            align-items: center;
            justify-content: space-between;

            padding: 18px 20px;

            border-bottom:
                1px solid rgba(255,255,255,.07);
        }

        .modal-header h2 {
            font-size: 19px;
        }

        .close-btn {
            width: 35px;
            height: 35px;

            border: 0;

            border-radius: 6px;

            background:
                rgba(255,255,255,.05);

            color: #fff;

            font-size: 18px;
        }

        .close-btn:hover {
            background: var(--orange);
        }

        .modal-body {
            padding: 20px;
        }

        /* =========================
           PRODUCT DETAIL
        ========================== */

        .detail-grid {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 20px;
        }

        .detail-image {
            height: 300px;

            background: #101010;

            border-radius: 8px;

            overflow: hidden;

            display: grid;
            place-items: center;
        }

        .detail-image img {
            width: 100%;
            height: 100%;

            object-fit: contain;
        }

        .detail-info h3 {
            font-size: 24px;

            margin-bottom: 12px;
        }

        .detail-info p {
            color: #999;

            line-height: 2;

            font-size: 13px;

            margin-bottom: 18px;
        }

        .detail-price {
            color: var(--orange);

            font-size: 27px;

            font-weight: 900;

            margin-bottom: 20px;
        }

        /* =========================
           CART
        ========================== */

        .cart-items {
            display: flex;

            flex-direction: column;

            gap: 10px;

            margin-bottom: 20px;
        }

        .cart-item {
            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 10px;

            padding: 13px;

            background:
                rgba(255,255,255,.035);

            border:
                1px solid rgba(255,255,255,.06);

            border-radius: 7px;
        }

        .cart-item-name {
            font-size: 13px;

            font-weight: 700;
        }

        .cart-item-price {
            color: var(--orange);

            font-size: 13px;

            font-weight: 800;
        }

        .quantity {
            display: flex;

            align-items: center;

            gap: 8px;
        }

        .quantity button {
            width: 28px;
            height: 28px;

            border: 0;

            background: #242424;

            color: #fff;

            border-radius: 4px;
        }

        .quantity button:hover {
            background: var(--orange);
        }

        .quantity span {
            min-width: 20px;

            text-align: center;

            font-weight: 800;
        }

        .cart-summary {
            border-top:
                1px solid rgba(255,255,255,.08);

            padding-top: 17px;
        }

        .summary-row {
            display: flex;

            justify-content: space-between;

            color: #aaa;

            font-size: 13px;

            margin-bottom: 9px;
        }

        .summary-row.total {
            color: #fff;

            font-size: 18px;

            font-weight: 900;

            margin-top: 12px;
        }

        .summary-row.total strong {
            color: var(--orange);
        }

        .checkout-btn {
            width: 100%;

            height: 48px;

            border: 0;

            border-radius: 6px;

            background: #25D366;

            color: #fff;

            font-size: 14px;

            font-weight: 900;

            margin-top: 15px;

            transition: .2s;
        }

        .checkout-btn:hover {
            box-shadow:
                0 0 25px rgba(37,211,102,.25);
        }

        .checkout-btn:active {
            transform: scale(.97);
        }

        /* =========================
           TOAST
        ========================== */

        .toast {
            position: fixed;

            left: 50%;

            bottom: 25px;

            transform:
                translate(-50%, 30px);

            opacity: 0;

            pointer-events: none;

            z-index: 5000;

            background: #181818;

            border:
                1px solid rgba(255,107,0,.3);

            color: #fff;

            padding:
                12px 18px;

            border-radius: 7px;

            font-size: 13px;

            box-shadow:
                0 15px 40px rgba(0,0,0,.5);

            transition: .25s;
        }

        .toast.show {
            opacity: 1;

            transform:
                translate(-50%, 0);
        }

        /* =========================
           FOOTER
        ========================== */

        footer {
            border-top:
                1px solid rgba(255,255,255,.06);

            text-align: center;

            color: #666;

            padding:
                27px 15px;

            font-size: 12px;
        }

        footer strong {
            color: #aaa;
        }

        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 850px) {

            header {
                height: 68px;
            }

            .nav {
                width: 100%;
                padding: 0 18px;
            }

            .logo {
                font-size: 21px;
            }

            .logo-mark {
                width: 29px;
                height: 29px;
            }

            .nav-links,
            .nav-button {
                display: none;
            }

            .menu-btn {
                display: block;
            }

            .page {
                width: 100%;

                padding:
                    105px
                    15px
                    55px;
            }

            .controls {
                grid-template-columns: 1fr;
            }

            .sort-select {
                width: 100%;
            }

            .products-grid {
                grid-template-columns: repeat(2, 1fr);

                gap: 10px;
            }

            .product-image {
                height: 175px;
            }

            .product-info {
                padding: 13px;
            }

            .product-name {
                font-size: 14px;
            }

            .product-description {
                font-size: 11px;
                min-height: 40px;
            }

            .price {
                font-size: 17px;
            }

            .order-btn {
                min-height: 38px;

                padding: 0 9px;

                font-size: 10px;
            }

            .detail-grid {
                grid-template-columns: 1fr;
            }

            .detail-image {
                height: 240px;
            }
        }

        @media (max-width: 450px) {

            .products-grid {
                grid-template-columns: 1fr 1fr;
            }

            .product-image {
                height: 145px;
            }

            .product-category {
                font-size: 9px;
            }

            .product-name {
                font-size: 13px;
            }

            .product-description {
                font-size: 10px;
            }

            .product-bottom {
                align-items: flex-end;

                flex-direction: column;
            }

            .order-btn {
                width: 100%;
            }

            .price {
                width: 100%;
            }
        }

        /* =========================
           MOBILE MENU
        ========================== */

        .mobile-menu {
            position: fixed;

            inset: 0;

            background:
                rgba(0,0,0,.7);

            backdrop-filter: blur(5px);

            z-index: 4000;

            opacity: 0;

            visibility: hidden;

            transition: .25s;
        }

        .mobile-menu.show {
            opacity: 1;

            visibility: visible;
        }

        .mobile-panel {
            position: absolute;

            top: 0;
            right: 0;

            width: min(82%, 340px);

            height: 100%;

            background:
                linear-gradient(
                    160deg,
                    #171717,
                    #090909
                );

            border-left:
                1px solid rgba(255,107,0,.2);

            padding: 25px;

            transform:
                translateX(100%);

            transition: .3s;
        }

        .mobile-menu.show .mobile-panel {
            transform:
                translateX(0);
        }

        .close-menu {
            border: 0;

            background: transparent;

            color: #fff;

            font-size: 25px;

            margin-bottom: 35px;
        }

        .mobile-panel a {
            display: flex;

            align-items: center;

            gap: 13px;

            padding: 16px 0;

            color: #ddd;

            border-bottom:
                1px solid rgba(255,255,255,.06);

            font-weight: 700;
        }

        .mobile-panel a i {
            color: var(--orange);
        }

    </style>

</head>

<body>

<header>

    <nav class="nav">

        <a href="/home" class="logo">

            <div class="logo-mark">
                <span>C</span>
            </div>

            <span>
                <span class="logo-c">CEMENT</span><span class="logo-fit">FIT</span>
            </span>

        </a>

        <div class="nav-links">

            <a href="/home">
                الرئيسية
            </a>

            <a href="/products" class="active">
                المنتجات
            </a>

        </div>

        <a
            class="nav-button"
            href="https://wa.me/201212338084"
            target="_blank"
        >
            اطلب الآن
        </a>

        <button
            class="menu-btn"
            onclick="openMenu()"
        >
            <i class="fa-solid fa-bars"></i>
        </button>

    </nav>

</header>

<!-- MOBILE MENU -->

<div
    class="mobile-menu"
    id="mobileMenu"
>

    <div class="mobile-panel">

        <button
            class="close-menu"
            onclick="closeMenu()"
        >
            <i class="fa-solid fa-xmark"></i>
        </button>

        <a href="/home">
            <i class="fa-solid fa-house"></i>
            الرئيسية
        </a>

        <a href="/products">
            <i class="fa-solid fa-dumbbell"></i>
            المنتجات
        </a>

        <a
            href="https://wa.me/201212338084"
            target="_blank"
        >
            <i class="fa-brands fa-whatsapp"></i>
            تواصل معنا
        </a>

    </div>

</div>

<!-- PAGE -->

<main class="page">

    <div class="page-header">

        <small>CEMENTFIT STORE</small>

        <h1>
            منتجاتنا
        </h1>

        <p>
            اختار الوزن والمعدة المناسبة ليك
            وابدأ تمرينك من البيت.
        </p>

    </div>

    <!-- CONTROLS -->

    <div class="controls">

        <div class="search-box">

            <i class="fa-solid fa-magnifying-glass"></i>

            <input
                type="text"
                id="searchInput"
                placeholder="ابحث عن منتج..."
            >

        </div>

        <select
            id="sortSelect"
            class="sort-select"
        >

            <option value="default">
                الترتيب الافتراضي
            </option>

            <option value="high">
                السعر: من الأعلى للأقل
            </option>

            <option value="low">
                السعر: من الأقل للأعلى
            </option>

        </select>

    </div>

    <!-- CATEGORIES -->

    <div class="categories">

        <button
            class="category-btn active"
            data-category="all"
        >
            الكل
        </button>

        <button
            class="category-btn"
            data-category="دامبلز"
        >
            دامبلز
        </button>

        <button
            class="category-btn"
            data-category="طارات"
        >
            طارات
        </button>

        <button
            class="category-btn"
            data-category="كيتل بيل"
        >
            كيتل بيل
        </button>

    </div>

    <!-- PRODUCTS -->

    <div
        class="products-grid"
        id="productsGrid"
    >

        <div class="loading">

            <i class="fa-solid fa-spinner"></i>

            <p>
                جاري تحميل المنتجات...
            </p>

        </div>

    </div>

</main>

<footer>

    © 2026
    <strong>CEMENTFIT</strong>
    — معاك لحد ما توصل لهدفك

</footer>

<!-- PRODUCT MODAL -->

<div
    class="modal"
    id="productModal"
>

    <div class="modal-box">

        <div class="modal-header">

            <h2>
                تفاصيل المنتج
            </h2>

            <button
                class="close-btn"
                onclick="closeProductModal()"
            >
                <i class="fa-solid fa-xmark"></i>
            </button>

        </div>

        <div
            class="modal-body"
            id="productModalBody"
        ></div>

    </div>

</div>

<!-- CART MODAL -->

<div
    class="modal"
    id="cartModal"
>

    <div class="modal-box">

        <div class="modal-header">

            <h2>
                سلة الطلب
            </h2>

            <button
                class="close-btn"
                onclick="closeCart()"
            >
                <i class="fa-solid fa-xmark"></i>
            </button>

        </div>

        <div class="modal-body">

            <div
                class="cart-items"
                id="cartItems"
            ></div>

            <div class="cart-summary">

                <div class="summary-row">

                    <span>
                        المنتجات
                    </span>

                    <span id="subtotal">
                        0 ج.م
                    </span>

                </div>

                <div class="summary-row">

                    <span>
                        الشحن
                    </span>

                    <span id="shipping">
                        0 ج.م
                    </span>

                </div>

                <div class="summary-row total">

                    <span>
                        الإجمالي
                    </span>

                    <strong id="total">
                        0 ج.م
                    </strong>

                </div>

                <button
                    class="checkout-btn"
                    onclick="checkoutWhatsApp()"
                >

                    <i class="fa-brands fa-whatsapp"></i>

                    إتمام الطلب عبر WhatsApp

                </button>

            </div>

        </div>

    </div>

</div>

<!-- TOAST -->

<div
    class="toast"
    id="toast"
></div>

<script>

    /* =========================
       SUPABASE
    ========================== */

    const SUPABASE_URL =
        "https://mhdprpqckntptvgsmnlo.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_0qMAGKpfoQpHa5FoO-lNLg_5OIc2Kn_";

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    /* =========================
       VARIABLES
    ========================== */

    let products = [];

    let filteredProducts = [];

    let selectedCategory = "all";

    let cart = [];


    /* =========================
       LOAD PRODUCTS
    ========================== */

    async function loadProducts() {

        const grid =
            document.getElementById(
                "productsGrid"
            );

        grid.innerHTML = `
            <div class="loading">
                <i class="fa-solid fa-spinner"></i>
                <p>جاري تحميل المنتجات...</p>
            </div>
        `;

        try {

            const {
                data,
                error
            } = await supabaseClient
                .from("products")
                .select("*")
                .order("id", {
                    ascending: false
                });

            if (error) {
                throw error;
            }

            products = data || [];

            filteredProducts =
                [...products];

            renderProducts();

        } catch (error) {

            console.error(
                "Supabase error:",
                error
            );

            grid.innerHTML = `
                <div class="empty">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    <h3>حدث خطأ في تحميل المنتجات</h3>
                    <p>حاول تحديث الصفحة مرة أخرى.</p>
                </div>
            `;

        }

    }


    /* =========================
       RENDER
    ========================== */

    function renderProducts() {

        const grid =
            document.getElementById(
                "productsGrid"
            );

        if (!filteredProducts.length) {

            grid.innerHTML = `
                <div class="empty">
                    <i class="fa-solid fa-box-open"></i>
                    <h3>مفيش منتجات</h3>
                    <p>جرب كلمة بحث أو تصنيف مختلف.</p>
                </div>
            `;

            return;
        }

        grid.innerHTML =
            filteredProducts
                .map(product => {

                    const name =
                        product.name ||
                        "منتج CEMENTFIT";

                    const description =
                        product.description ||
                        "منتج من CEMENTFIT";

                    const category =
                        product.category ||
                        "منتجات";

                    const price =
                        Number(product.price) || 0;

                    const image =
                        product.image_url ||
                        product.image ||
                        "";

                    return `

                        <article
                            class="product-card"
                        >

                            <div
                                class="product-image"
                                onclick="openProduct(${product.id})"
                                style="cursor:pointer"
                            >

                                ${
                                    image
                                    ?
                                    `
                                    <img
                                        src="${escapeHtml(image)}"
                                        alt="${escapeHtml(name)}"
                                        onerror="this.style.display='none';this.nextElementSibling.style.display='block';"
                                    >
                                    `
                                    :
                                    ""
                                }

                                <div
                                    class="image-fallback"
                                    style="
                                        display:${image ? "none" : "block"}
                                    "
                                >
                                    <i class="fa-solid fa-dumbbell"></i>
                                </div>

                            </div>

                            <div
                                class="product-info"
                            >

                                <span
                                    class="product-category"
                                >
                                    ${escapeHtml(category)}
                                </span>

                                <h3
                                    class="product-name"
                                >
                                    ${escapeHtml(name)}
                                </h3>

                                <p
                                    class="product-description"
                                >
                                    ${escapeHtml(description)}
                                </p>

                                <div
                                    class="product-bottom"
                                >

                                    <div
                                        class="price"
                                    >
                                        ${formatPrice(price)}
                                        <span>ج.م</span>
                                    </div>

                                    <button
                                        class="order-btn"
                                        onclick="addToCart(${product.id})"
                                    >
                                        <i class="fa-solid fa-cart-plus"></i>
                                        أضف للسلة
                                    </button>

                                </div>

                            </div>

                        </article>

                    `;

                })
                .join("");

    }


    /* =========================
       SEARCH + FILTER
    ========================== */

    function filterProducts() {

        const search =
            document
                .getElementById(
                    "searchInput"
                )
                .value
                .trim()
                .toLowerCase();

        filteredProducts =
            products.filter(product => {

                const name =
                    String(
                        product.name || ""
                    ).toLowerCase();

                const description =
                    String(
                        product.description || ""
                    ).toLowerCase();

                const category =
                    String(
                        product.category || ""
                    ).toLowerCase();

                const matchesSearch =
                    !search ||
                    name.includes(search) ||
                    description.includes(search) ||
                    category.includes(search);

                const matchesCategory =
                    selectedCategory === "all" ||
                    category ===
                        selectedCategory.toLowerCase();

                return (
                    matchesSearch &&
                    matchesCategory
                );

            });

        sortProducts();

    }


    /* =========================
       SORT
    ========================== */

    function sortProducts() {

        const sort =
            document
                .getElementById(
                    "sortSelect"
                )
                .value;

        if (sort === "high") {

            filteredProducts.sort(
                (a,b) =>
                    Number(b.price || 0) -
                    Number(a.price || 0)
            );

        }

        else if (sort === "low") {

            filteredProducts.sort(
                (a,b) =>
                    Number(a.price || 0) -
                    Number(b.price || 0)
            );

        }

        else {

            filteredProducts.sort(
                (a,b) =>
                    Number(b.id || 0) -
                    Number(a.id || 0)
            );

        }

        renderProducts();

    }


    document
        .getElementById("searchInput")
        .addEventListener(
            "input",
            filterProducts
        );


    document
        .getElementById("sortSelect")
        .addEventListener(
            "change",
            sortProducts
        );


    document
        .querySelectorAll(".category-btn")
        .forEach(button => {

            button.addEventListener(
                "click",
                function() {

                    document
                        .querySelectorAll(
                            ".category-btn"
                        )
                        .forEach(btn =>
                            btn.classList.remove(
                                "active"
                            )
                        );

                    this.classList.add(
                        "active"
                    );

                    selectedCategory =
                        this.dataset.category;

                    filterProducts();

                }
            );

        });


    /* =========================
       PRODUCT DETAIL
    ========================== */

    function openProduct(id) {

        const product =
            products.find(
                p =>
                    Number(p.id) ===
                    Number(id)
            );

        if (!product) return;

        const image =
            product.image_url ||
            product.image ||
            "";

        const price =
            Number(product.price) || 0;

        document
            .getElementById(
                "productModalBody"
            )
            .innerHTML = `

                <div class="detail-grid">

                    <div class="detail-image">

                        ${
                            image
                            ?
                            `
                            <img
                                src="${escapeHtml(image)}"
                                alt="${escapeHtml(product.name || "")}"
                            >
                            `
                            :
                            `
                            <i
                                class="fa-solid fa-dumbbell"
                                style="
                                    font-size:65px;
                                    color:#ff6b00;
                                "
                            ></i>
                            `
                        }

                    </div>

                    <div class="detail-info">

                        <span class="product-category">
                            ${escapeHtml(product.category || "منتج")}
                        </span>

                        <h3>
                            ${escapeHtml(product.name || "منتج")}
                        </h3>

                        <p>
                            ${escapeHtml(
                                product.description ||
                                "منتج CEMENTFIT"
                            )}
                        </p>

                        <div class="detail-price">
                            ${formatPrice(price)}
                            <small style="font-size:12px">
                                ج.م
                            </small>
                        </div>

                        <button
                            class="order-btn"
                            style="width:100%;height:48px"
                            onclick="addToCart(${product.id}); closeProductModal();"
                        >
                            <i class="fa-solid fa-cart-plus"></i>
                            أضف للسلة
                        </button>

                    </div>

                </div>

            `;

        document
            .getElementById(
                "productModal"
            )
            .classList.add("show");

    }


    function closeProductModal() {

        document
            .getElementById(
                "productModal"
            )
            .classList.remove("show");

    }


    /* =========================
       CART
    ========================== */

    function addToCart(id) {

        const product =
            products.find(
                p =>
                    Number(p.id) ===
                    Number(id)
            );

        if (!product) return;

        const existing =
            cart.find(
                item =>
                    Number(item.id) ===
                    Number(id)
            );

        if (existing) {

            existing.quantity++;

        } else {

            cart.push({
                id: product.id,
                name: product.name,
                price: Number(product.price) || 0,
                quantity: 1
            });

        }

        showToast(
            "تمت إضافة المنتج للسلة"
        );

        renderCart();

    }


    function changeQuantity(
        id,
        change
    ) {

        const item =
            cart.find(
                p =>
                    Number(p.id) ===
                    Number(id)
            );

        if (!item) return;

        item.quantity += change;

        if (item.quantity <= 0) {

            cart =
                cart.filter(
                    p =>
                        Number(p.id) !==
                        Number(id)
                );

        }

        renderCart();

    }


    function renderCart() {

        const container =
            document.getElementById(
                "cartItems"
            );

        if (!cart.length) {

            container.innerHTML = `
                <div class="empty">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <h3>السلة فاضية</h3>
                    <p>أضف المنتجات اللي عايز تطلبها.</p>
                </div>
            `;

        } else {

            container.innerHTML =
                cart
                    .map(item => `

                        <div class="cart-item">

                            <div>

                                <div
                                    class="cart-item-name"
                                >
                                    ${escapeHtml(item.name)}
                                </div>

                                <div
                                    class="cart-item-price"
                                >
                                    ${formatPrice(item.price)}
                                    ج.م
                                </div>

                            </div>

                            <div class="quantity">

                                <button
                                    onclick="changeQuantity(${item.id},1)"
                                >
                                    +
                                </button>

                                <span>
                                    ${item.quantity}
                                </span>

                                <button
                                    onclick="changeQuantity(${item.id},-1)"
                                >
                                    -
                                </button>

                            </div>

                        </div>

                    `)
                    .join("");

        }

        let subtotal = 0;

        cart.forEach(item => {

            subtotal +=
                item.price *
                item.quantity;

        });

        const shipping =
            subtotal > 0
            ? 0
            : 0;

        const total =
            subtotal + shipping;

        document
            .getElementById("subtotal")
            .textContent =
            `${formatPrice(subtotal)} ج.م`;

        document
            .getElementById("shipping")
            .textContent =
            shipping === 0
            ? "يحدد لاحقًا"
            : `${formatPrice(shipping)} ج.م`;

        document
            .getElementById("total")
            .textContent =
            `${formatPrice(total)} ج.م`;

    }


    function openCart() {

        renderCart();

        document
            .getElementById(
                "cartModal"
            )
            .classList.add("show");

    }


    function closeCart() {

        document
            .getElementById(
                "cartModal"
            )
            .classList.remove("show");

    }


    /* =========================
       WHATSAPP
    ========================== */

    function checkoutWhatsApp() {

        if (!cart.length) {

            showToast(
                "السلة فاضية"
            );

            return;

        }

        let message =
            "السلام عليكم، عايز أطلب من CEMENTFIT:%0A%0A";

        cart.forEach(item => {

            message +=
                `• ${item.name} × ${item.quantity} — ${formatPrice(item.price * item.quantity)} ج.م%0A`;

        });

        let subtotal = 0;

        cart.forEach(item => {

            subtotal +=
                item.price *
                item.quantity;

        });

        message +=
            `%0Aالإجمالي: ${formatPrice(subtotal)} ج.م`;

        const url =
            `https://wa.me/201212338084?text=${message}`;

        window.open(
            url,
            "_blank"
        );

    }


    /* =========================
       HELPERS
    ========================== */

    function formatPrice(price) {

        return Number(price || 0)
            .toLocaleString("en-US");

    }


    function escapeHtml(value) {

        return String(value ?? "")
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );

    }


    function showToast(message) {

        const toast =
            document.getElementById(
                "toast"
            );

        toast.textContent =
            message;

        toast.classList.add(
            "show"
        );

        setTimeout(() => {

            toast.classList.remove(
                "show"
            );

        }, 2200);

    }


    /* =========================
       MOBILE MENU
    ========================== */

    function openMenu() {

        document
            .getElementById(
                "mobileMenu"
            )
            .classList.add("show");

    }


    function closeMenu() {

        document
            .getElementById(
                "mobileMenu"
            )
            .classList.remove("show");

    }


    document
        .getElementById(
            "mobileMenu"
        )
        .addEventListener(
            "click",
            function(e) {

                if (e.target === this) {
                    closeMenu();
                }

            }
        );


    /* =========================
       CLOSE MODALS
    ========================== */

    document
        .getElementById(
            "productModal"
        )
        .addEventListener(
            "click",
            function(e) {

                if (e.target === this) {
                    closeProductModal();
                }

            }
        );


    document
        .getElementById(
            "cartModal"
        )
        .addEventListener(
            "click",
            function(e) {

                if (e.target === this) {
                    closeCart();
                }

            }
        );


    /* =========================
       START
    ========================== */

    loadProducts();

</script>

</body>
</html>
