<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CEMENTFIT | جميع المنتجات</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        :root {
            --bg-color: #0d0f12;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-hover: rgba(255, 255, 255, 0.1);
            --accent-orange: #ff6b35;
            --accent-glow: rgba(255, 107, 53, 0.35);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 90px;
            overflow-x: hidden;
            position: relative;
        }

        .glow-blob-1 {
            position: fixed;
            top: -100px;
            right: -100px;
            width: 350px;
            height: 350px;
            background: var(--accent-orange);
            filter: blur(140px);
            opacity: 0.25;
            border-radius: 50%;
            z-index: -1;
            pointer-events: none;
        }

        .glow-blob-2 {
            position: fixed;
            bottom: -50px;
            left: -100px;
            width: 400px;
            height: 400px;
            background: #e85d04;
            filter: blur(160px);
            opacity: 0.18;
            border-radius: 50%;
            z-index: -1;
            pointer-events: none;
        }

        header {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 1100px;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 900;
            color: #fff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            direction: ltr;
        }
        .logo-cement { color: #ffffff; }
        .logo-fit { color: var(--accent-orange); }

        .nav-btn {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 700;
            padding: 8px 18px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--glass-border);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.18);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        /* Floating Circular Cart Button (Bottom Right) */
        .floating-cart-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--accent-orange), #e85d04);
            color: #fff;
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            cursor: pointer;
            z-index: 1500;
            box-shadow: 0 6px 20px var(--accent-glow), 0 4px 10px rgba(0,0,0,0.4);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .floating-cart-btn:hover, .floating-cart-btn:active {
            transform: scale(1.12) rotate(5deg);
            box-shadow: 0 0 25px var(--accent-orange), 0 0 40px var(--accent-glow);
        }

        .floating-cart-badge {
            position: absolute;
            top: -2px;
            right: -2px;
            background: #fff;
            color: var(--accent-orange);
            font-size: 0.75rem;
            font-weight: 900;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }

        /* Glassy Toast Notification */
        .toast-notification {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(25, 28, 35, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            color: #fff;
            padding: 12px 24px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 3000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 15px var(--accent-glow);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
        }

        .toast-notification.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .container { max-width: 1100px; margin: 110px auto 0; padding: 0 20px; }
        .title { text-align: center; margin-bottom: 25px; font-size: 2.2rem; font-weight: 900; animation: fadeIn 0.8s ease; direction: rtl; }

        /* Search & Filter Controls */
        .controls-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 35px;
        }

        .search-box {
            position: relative;
            width: 100%;
        }

        .search-input {
            width: 100%;
            padding: 12px 45px 12px 18px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .search-input:focus {
            border-color: var(--accent-orange);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .search-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .filter-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .filter-tags {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
            scrollbar-width: none;
            flex-grow: 1;
        }

        .filter-btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
            padding: 8px 18px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.88rem;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .filter-btn:hover, .filter-btn.active {
            background: linear-gradient(135deg, var(--accent-orange), #e85d04);
            color: #fff;
            border-color: transparent;
            transform: scale(1.06);
            box-shadow: 0 0 15px var(--accent-orange), 0 4px 15px var(--accent-glow);
        }

        .sort-select-wrapper {
            position: relative;
            min-width: 180px;
        }

        .sort-select {
            width: 100%;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 9px 15px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.88rem;
            outline: none;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            appearance: none;
        }

        .sort-select:focus {
            border-color: var(--accent-orange);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .sort-select option {
            background: #191c23;
            color: #fff;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .product-card {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 22px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            position: relative;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            animation: fadeInUp 0.6s ease forwards;
        }

        .product-card:hover {
            transform: translateY(-7px) scale(1.02);
            background: var(--glass-hover);
            border-color: rgba(255, 255, 255, 0.25);
            box-shadow: 0 15px 35px rgba(0,0,0,0.4), 0 0 20px var(--accent-glow);
        }

        .discount-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: linear-gradient(135deg, #ff6b35, #e85d04);
            color: #fff;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 800;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 5;
        }

        .product-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background: rgba(0,0,0,0.4);
            border-bottom: 1px solid var(--glass-border);
        }

        .product-info { padding: 20px; display: flex; flex-direction: column; flex-grow: 1; }
        .product-name { font-size: 1.3rem; font-weight: 800; margin-bottom: 8px; color: #fff; }
        .product-desc { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 15px; flex-grow: 1; line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        
        .price-container { display: flex; align-items: baseline; gap: 8px; }
        .price { font-size: 1.3rem; font-weight: 900; color: var(--accent-orange); }
        .old-price { font-size: 0.95rem; color: var(--text-muted); text-decoration: line-through; }

        .product-footer { display: flex; justify-content: space-between; align-items: center; margin-top: auto; gap: 10px; }

        .btn-add-cart {
            background: linear-gradient(135deg, var(--accent-orange), #e85d04);
            color: #fff;
            padding: 9px 16px;
            border-radius: 12px;
            border: none;
            font-weight: 700;
            font-size: 0.88rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .btn-add-cart:hover, .btn-add-cart:active {
            transform: scale(1.08);
            box-shadow: 0 0 20px var(--accent-orange), 0 0 30px var(--accent-glow);
        }

        /* Modals & Cart Drawer */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex; justify-content: center; align-items: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 20px;
        }

        .modal-overlay.active { opacity: 1; visibility: visible; }

        .modal-card {
            background: rgba(25, 28, 35, 0.95);
            backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            max-width: 520px;
            width: 100%;
            overflow: hidden;
            position: relative;
            transform: scale(0.8) translateY(30px);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }

        .modal-overlay.active .modal-card { transform: scale(1) translateY(0); }

        .modal-close {
            position: absolute;
            top: 15px; left: 15px;
            width: 36px; height: 36px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid var(--glass-border);
            border-radius: 50%;
            color: #fff;
            font-size: 1.2rem;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            z-index: 10;
            transition: all 0.3s ease;
        }

        .modal-close:hover { background: rgba(239, 68, 68, 0.8); transform: rotate(90deg); }

        .modal-img { width: 100%; max-height: 250px; object-fit: cover; border-bottom: 1px solid var(--glass-border); }
        .modal-body { padding: 20px; }
        .modal-title { font-size: 1.5rem; font-weight: 900; margin-bottom: 8px; color: #fff; }
        .modal-desc { color: var(--text-muted); line-height: 1.6; margin-bottom: 15px; font-size: 0.9rem; }

        .shipping-info-box {
            background: rgba(255, 255, 255, 0.04);
            border: 1px dashed var(--glass-border);
            border-radius: 12px;
            padding: 12px 15px;
            margin-bottom: 20px;
            font-size: 0.88rem;
        }
        .shipping-info-box div { margin-bottom: 5px; display: flex; align-items: center; gap: 8px; }

        /* Cart Modal Specifics */
        .cart-modal-body {
            padding: 25px;
            max-height: 75vh;
            display: flex;
            flex-direction: column;
        }

        .cart-items-list {
            overflow-y: auto;
            max-height: 260px;
            margin-bottom: 15px;
            padding-left: 5px;
        }

        .cart-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 10px 14px;
            margin-bottom: 10px;
        }

        .cart-item-details h4 { font-size: 0.95rem; font-weight: 800; color: #fff; }
        .cart-item-details p { font-size: 0.85rem; color: var(--accent-orange); font-weight: 700; }

        .cart-item-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .qty-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            width: 26px; height: 26px;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .qty-btn:hover { background: var(--accent-orange); }

        .cart-summary {
            border-top: 1px solid var(--glass-border);
            padding-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .cart-shipping-row, .cart-total-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .cart-total-row {
            font-size: 1.15rem;
            font-weight: 900;
            color: #fff;
            border-top: 1px dashed var(--glass-border);
            padding-top: 8px;
        }

        .btn-checkout-whatsapp {
            background: #25d366;
            color: #fff;
            text-align: center;
            padding: 12px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 1rem;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
            transition: all 0.3s ease;
            margin-top: 5px;
        }

        .btn-checkout-whatsapp:hover, .btn-checkout-whatsapp:active {
            transform: scale(1.05);
            box-shadow: 0 0 20px #25d366;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="glow-blob-1"></div>
    <div class="glow-blob-2"></div>

    <!-- Toast Notification -->
    <div class="toast-notification" id="toastNotification">
        <i class="fa-solid fa-circle-check" style="color: #25d366; font-size: 1.2rem;"></i>
        <span id="toastText">تم إضافة المنتج للسلة بنجاح</span>
    </div>

    <header>
        <a href="index.html" class="logo">
            <i class="fa-solid fa-dumbbell" style="color: var(--accent-orange);"></i>
            <span><span class="logo-cement">CEMENT</span><span class="logo-fit">FIT</span></span>
        </a>
        <a href="index.html" class="nav-btn">الرئيسية</a>
    </header>

    <!-- Floating Circular Cart Button -->
    <button class="floating-cart-btn" onclick="openCartModal()">
        <i class="fa-solid fa-cart-shopping"></i>
        <span class="floating-cart-badge" id="cartCount">0</span>
    </button>

    <div class="container">
        <h1 class="title">منتجات <span class="logo-cement">CEMENT</span><span class="logo-fit">FIT</span></h1>
        
        <!-- Search & Filter Bar -->
        <div class="controls-section">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="searchInput" class="search-input" placeholder="ابحث عن منتج (مثل: دامبل، طارة...)" oninput="filterProducts()">
            </div>
            
            <div class="filter-row">
                <div class="filter-tags">
                    <button class="filter-btn active" onclick="setCategory('all', this)">الكل</button>
                    <button class="filter-btn" onclick="setCategory('دامبلز', this)">دامبلز</button>
                    <button class="filter-btn" onclick="setCategory('طارات', this)">طارات</button>
                    <button class="filter-btn" onclick="setCategory('كيتل بيل', this)">كيتل بيل</button>
                </div>

                <div class="sort-select-wrapper">
                    <select id="sortSelect" class="sort-select" onchange="filterProducts()">
                        <option value="default">الترتيب الافتراضي</option>
                        <option value="low-high">السعر: من الأقل للأعلى</option>
                        <option value="high-low">السعر: من الأعلى للأقل</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="products-grid" id="products-container">
            <p style="grid-column: 1/-1; text-align: center; color: var(--text-muted);">جاري تحميل المنتجات...</p>
        </div>
    </div>

    <!-- Product Details Modal -->
    <div class="modal-overlay" id="productModal" onclick="closeModal(event)">
        <div class="modal-card">
            <button class="modal-close" onclick="forceCloseModal('productModal')">&times;</button>
            <img src="" id="modalImg" class="modal-img" alt="المنتج">
            <div class="modal-body">
                <h2 class="modal-title" id="modalTitle"></h2>
                <p class="modal-desc" id="modalDesc"></p>

                <div class="shipping-info-box">
                    <div><i class="fa-solid fa-truck" style="color: var(--accent-orange);"></i> <span>مصاريف الشحن: <strong id="modalShippingPrice" style="color:#fff;"></strong></span></div>
                    <div><i class="fa-solid fa-location-dot" style="color: var(--accent-orange);"></i> <span>الأماكن المتاحة للشحن: <strong id="modalShippingLocs" style="color:#fff;"></strong></span></div>
                </div>

                <div class="product-footer">
                    <div class="price-container">
                        <span class="price" id="modalPrice"></span>
                        <span class="old-price" id="modalOldPrice"></span>
                    </div>
                    <button id="modalAddToCartBtn" class="btn-add-cart">
                        أضف للسلة <i class="fa-solid fa-cart-plus"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Shopping Cart Modal -->
    <div class="modal-overlay" id="cartModal" onclick="closeModal(event)">
        <div class="modal-card">
            <button class="modal-close" onclick="forceCloseModal('cartModal')">&times;</button>
            <div class="cart-modal-body">
                <h2 style="font-size: 1.5rem; font-weight: 900; margin-bottom: 15px; color: #fff;">
                    <i class="fa-solid fa-cart-shopping" style="color: var(--accent-orange);"></i> سلة المشتريات
                </h2>
                
                <div class="cart-items-list" id="cartItemsContainer">
                    <!-- Items rendered dynamically -->
                </div>

                <div class="cart-summary">
                    <div class="cart-shipping-row">
                        <span>تكلفة الشحن (<span id="cartShippingLoc" style="color:#fff;">لا يوجد</span>):</span>
                        <span id="cartShippingPriceVal" style="color: var(--accent-orange);">0 ج.م</span>
                    </div>
                    <div class="cart-total-row">
                        <span>الإجمالي الكلي (شامل الشحن):</span>
                        <span id="cartTotalPrice" style="color: var(--accent-orange);">0 ج.م</span>
                    </div>
                    <a href="#" id="whatsappCheckoutBtn" target="_blank" class="btn-checkout-whatsapp">
                        تأكيد الطلب عبر واتساب <i class="fa-brands fa-whatsapp"></i>
                    </a>
                </div>
            </div>
        </div>
    </div >

    <script>
        const SUPABASE_URL = 'https://mhdprpqckntptvgsmnlo.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_0qMAGKpfoQpHa5FoO-lNLg_5OIc2Kn_';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let productsData = [];
        let cart = [];
        let currentCategory = 'all';
        let toastTimeout = null;

        function showToast(message) {
            const toast = document.getElementById('toastNotification');
            document.getElementById('toastText').innerText = message;
            toast.classList.add('show');

            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        async function loadProducts() {
            const container = document.getElementById('products-container');
            container.innerHTML = '';
            
            const { data: products, error } = await _supabase
                .from('products')
                .select('*')
                .order('id', { ascending: false });

            if (error || !products) {
                container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #ef4444;">حدث خطأ أثناء تحميل المنتجات.</p>';
                return;
            }

            productsData = products;
            filterProducts();
        }

        function renderProducts(list) {
            const container = document.getElementById('products-container');
            container.innerHTML = '';

            if (list.length === 0) {
                container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted);">لا توجد منتجات مطابقة لعملية البحث أو الفلترة.</p>';
                return;
            }

            list.forEach((prod, index) => {
                const defaultImg = 'https://via.placeholder.com/300x200?text=CementFit';
                let discountBadgeHtml = '';
                let oldPriceHtml = '';
                
                if (prod.old_price && prod.old_price > prod.price) {
                    const discountPercent = Math.round(((prod.old_price - prod.price) / prod.old_price) * 100);
                    discountBadgeHtml = `<div class="discount-badge">خصم ${discountPercent}%</div>`;
                    oldPriceHtml = `<span class="old-price">${prod.old_price} ج.م</span>`;
                }

                container.innerHTML += `
                    <div class="product-card" style="animation-delay: ${index * 0.05}s;" onclick="openModal(${prod.id})">
                        ${discountBadgeHtml}
                        <img src="${prod.image || defaultImg}" alt="${prod.name}" class="product-img">
                        <div class="product-info">
                            <h3 class="product-name">${prod.name}</h3>
                            <p class="product-desc">${prod.desc || 'منتج عالي الجودة من CEMENTFIT.'}</p>
                            <div class="product-footer">
                                <div class="price-container">
                                    <span class="price">${prod.price} ج.م</span>
                                    ${oldPriceHtml}
                                </div>
                                <button class="btn-add-cart" onclick="event.stopPropagation(); addToCart(${prod.id})">
                                    أضف للسلة <i class="fa-solid fa-cart-plus"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function filterProducts() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const sortVal = document.getElementById('sortSelect').value;
            
            let filtered = productsData.filter(p => {
                const matchesName = p.name ? p.name.toLowerCase().includes(query) : false;
                const matchesDesc = p.desc ? p.desc.toLowerCase().includes(query) : false;
                const matchesSearch = matchesName || matchesDesc;

                let matchesCat = true;
                if (currentCategory !== 'all') {
                    // توحيد الهاء والتاء المربوطة (ة -> ه) وإزالة لواحق الجمع لضمان المطابقة تماماً
                    const normalizeText = (txt) => txt ? txt.toLowerCase().replace(/ة/g, 'ه').replace(/(ات|ين|ان|s)$/, '') : '';
                    
                    const cleanCat = normalizeText(currentCategory);
                    const productName = normalizeText(p.name);
                    const productDesc = normalizeText(p.desc);

                    matchesCat = productName.includes(cleanCat) || productDesc.includes(cleanCat);
                }

                return matchesSearch && matchesCat;
            });

            // Sorting logic
            if (sortVal === 'low-high') {
                filtered.sort((a, b) => parseFloat(a.price) - parseFloat(b.price));
            } else if (sortVal === 'high-low') {
                filtered.sort((a, b) => parseFloat(b.price) - parseFloat(a.price));
            }

            renderProducts(filtered);
        }

        function setCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            filterProducts();
        }

        function addToCart(id) {
            const prod = productsData.find(p => p.id === id);
            if (!prod) return;

            const existing = cart.find(item => item.id === id);
            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({ ...prod, qty: 1 });
            }

            updateCartUI();
            showToast(`تم إضافة "${prod.name}" للسلة بنجاح`);
        }

        function changeQty(id, delta) {
            const item = cart.find(i => i.id === id);
            if (!item) return;

            item.qty += delta;
            if (item.qty <= 0) {
                cart = cart.filter(i => i.id !== id);
            }
            updateCartUI();
        }

        function updateCartUI() {
            const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
            document.getElementById('cartCount').innerText = totalItems;

            const itemsContainer = document.getElementById('cartItemsContainer');
            itemsContainer.innerHTML = '';

            if (cart.length === 0) {
                itemsContainer.innerHTML = '<p style="text-align: center; color: var(--text-muted); margin: 30px 0;">السلة فارغة حالياً</p>';
                document.getElementById('cartShippingPriceVal').innerText = '0 ج.م';
                document.getElementById('cartShippingLoc').innerText = 'لا يوجد';
                document.getElementById('cartTotalPrice').innerText = '0 ج.م';
                document.getElementById('whatsappCheckoutBtn').href = '#';
                return;
            }

            let productsTotalPrice = 0;
            let maxShippingPrice = 0;
            let maxShippingLocation = "حسب المتفق عليه";

            let orderSummaryText = "السلام عليكم،\nممكن اطلب:\n";

            cart.forEach(item => {
                const itemTotal = item.price * item.qty;
                productsTotalPrice += itemTotal;
                orderSummaryText += `${item.name} (${item.qty})\n`;

                const itemShipping = parseFloat(item.shipping_price) || 0;
                if (itemShipping > maxShippingPrice) {
                    maxShippingPrice = itemShipping;
                    maxShippingLocation = item.shipping_locations || "جميع المحافظات";
                }

                itemsContainer.innerHTML += `
                    <div class="cart-item">
                        <div class="cart-item-details">
                            <h4>${item.name}</h4>
                            <p>${item.price} ج.م &times; ${item.qty}</p>
                        </div>
                        <div class="cart-item-controls">
                            <button class="qty-btn" onclick="changeQty(${item.id}, -1)">-</button>
                            <span style="font-weight: 800; color: #fff;">${item.qty}</span>
                            <button class="qty-btn" onclick="changeQty(${item.id}, 1)">+</button>
                        </div>
                    </div>
                `;
            });

            const finalTotalPrice = productsTotalPrice + maxShippingPrice;

            document.getElementById('cartShippingPriceVal').innerText = `${maxShippingPrice} ج.م`;
            document.getElementById('cartShippingLoc').innerText = maxShippingLocation;
            document.getElementById('cartTotalPrice').innerText = `${finalTotalPrice} ج.م`;

            const encodedMsg = encodeURIComponent(orderSummaryText.trim());
            document.getElementById('whatsappCheckoutBtn').href = `https://wa.me/201212338084?text=${encodedMsg}`;
        }

        function openCartModal() {
            updateCartUI();
            document.getElementById('cartModal').classList.add('active');
        }

        function openModal(id) {
            const prod = productsData.find(p => p.id === id);
            if(!prod) return;

            document.getElementById('modalImg').src = prod.image || 'https://via.placeholder.com/300x200?text=CementFit';
            document.getElementById('modalTitle').innerText = prod.name;
            document.getElementById('modalDesc').innerText = prod.desc || 'لا يوجد وصف إضافي.';
            document.getElementById('modalPrice').innerText = prod.price + ' ج.م';
            
            const oldPriceEl = document.getElementById('modalOldPrice');
            if (prod.old_price && prod.old_price > prod.price) {
                oldPriceEl.innerText = prod.old_price + ' ج.م';
                oldPriceEl.style.display = 'inline';
            } else {
                oldPriceEl.style.display = 'none';
            }

            document.getElementById('modalShippingPrice').innerText = prod.shipping_price ? `${prod.shipping_price} ج.م` : 'مجاناً أو يحدد مع الطلب';
            document.getElementById('modalShippingLocs').innerText = prod.shipping_locations || 'جميع المحافظات';

            const addBtn = document.getElementById('modalAddToCartBtn');
            addBtn.onclick = function() {
                addToCart(prod.id);
                forceCloseModal('productModal');
            };

            document.getElementById('productModal').classList.add('active');
        }

        function closeModal(e) {
            if(e.target.classList.contains('modal-overlay')) {
                e.target.classList.remove('active');
            }
        }

        function forceCloseModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        loadProducts();
    </script>
</body>
</html>
